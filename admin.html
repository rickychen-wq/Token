<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a09">
<title>後台 · 籌碼桌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600;800&display=swap');

@property --ang { syntax:'<angle>'; initial-value:0deg; inherits:false; }

:root{
  --bg:#04060a;
  --ink:#dbe6f0;
  --dim:#5d7183;
  --cy:#22d3ee;
  --cy-d:#0b7f96;
  --am:#ffb020;
  --mg:#ff3d7f;
  --li:#9bff4d;
  --red:#ff3b5c;
  --line:rgba(34,211,238,.16);
  --line-2:rgba(34,211,238,.32);
  --mono:'Share Tech Mono',ui-monospace,monospace;
  --sans:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Orbitron',var(--sans);
  --notch:10px;
  --cut:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%,0 var(--notch));
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;
  overscroll-behavior:none;position:relative;overflow-x:hidden;
}

/* ---- 網格底 ---- */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    linear-gradient(rgba(34,211,238,.055) 1px,transparent 1px) 0 0/42px 42px,
    linear-gradient(90deg,rgba(34,211,238,.055) 1px,transparent 1px) 0 0/42px 42px,
    linear-gradient(rgba(34,211,238,.11) 1px,transparent 1px) 0 0/210px 210px,
    linear-gradient(90deg,rgba(34,211,238,.11) 1px,transparent 1px) 0 0/210px 210px,
    radial-gradient(120% 90% at 50% 0%,#071018,#04060a 62%);
  mask-image:radial-gradient(130% 100% at 50% 12%,#000 32%,transparent 92%);
  -webkit-mask-image:radial-gradient(130% 100% at 50% 12%,#000 32%,transparent 92%);
}
/* ---- 掃描光束 ---- */
body::after{
  content:'';position:fixed;left:0;right:0;height:180px;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(34,211,238,.055) 45%,rgba(34,211,238,.09) 50%,transparent);
  animation:scan 7.5s linear infinite;
}
@keyframes scan{0%{top:-190px}100%{top:100%}}
@keyframes spin{to{--ang:360deg}}

button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font-family:var(--mono);font-size:16px}
:focus-visible{outline:1px solid var(--cy);outline-offset:3px}

/* ============ HUD 面板 ============ */
.panel{
  position:relative;padding:20px;margin-bottom:16px;
  clip-path:var(--cut);
  background:linear-gradient(170deg,rgba(12,24,32,.88),rgba(6,12,18,.92));
  border:1px solid var(--line);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
}
/* 角落定位標 */
.panel::before,.panel::after{
  content:'';position:absolute;width:16px;height:16px;pointer-events:none;
  border:1px solid var(--cy);opacity:.55;
}
.panel::before{top:6px;right:6px;border-left:0;border-bottom:0}
.panel::after{bottom:6px;left:6px;border-right:0;border-top:0}

.panel h2{
  margin:0 0 15px;font-family:var(--mono);font-size:11px;font-weight:400;
  color:var(--cy);letter-spacing:.26em;
  display:flex;align-items:center;gap:9px;
}
.panel h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}

/* RGB 只留一條細線在跑，不糊成一團 */
.rgb::before{
  content:'';position:absolute;inset:-1px;z-index:-1;clip-path:var(--cut);
  background:conic-gradient(from var(--ang),transparent 0deg,var(--cy) 22deg,#fff 30deg,var(--cy) 38deg,transparent 62deg,transparent 180deg,var(--mg) 202deg,transparent 240deg,transparent 360deg);
  animation:spin 4.5s linear infinite;
  border:0;opacity:1;width:auto;height:auto;top:auto;right:auto;
}

.field{margin-bottom:13px}
.field label{
  display:block;color:var(--dim);font-family:var(--mono);font-size:11px;
  margin-bottom:6px;letter-spacing:.16em;
}
.field input,.field select{
  width:100%;padding:12px 13px;color:var(--ink);
  background:rgba(0,0,0,.55);border:1px solid var(--line);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  transition:border-color .16s,box-shadow .16s;
}
.field input:focus,.field select:focus{
  border-color:var(--cy);box-shadow:inset 0 0 22px rgba(34,211,238,.13);outline:none;
}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ============ 按鈕 ============ */
.btn{
  position:relative;display:block;width:100%;padding:14px;
  font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.16em;
  color:#04060a;overflow:hidden;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  background:linear-gradient(100deg,var(--cy),#7ff0ff 48%,var(--cy));
  transition:transform .09s,filter .16s;
}
.btn::after{
  content:'';position:absolute;top:0;left:-60%;width:34%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-20deg);animation:sheen 4.2s ease-in-out infinite;
}
@keyframes sheen{0%,78%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(1px) scale(.985)}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.28;filter:grayscale(1);cursor:not-allowed}
.btn:disabled::after{display:none}

.btn.ghost{
  background:transparent;color:var(--cy);
  border:1px solid var(--line-2);
  box-shadow:inset 0 0 0 rgba(0,0,0,0);
}
.btn.ghost::after{display:none}
.btn.ghost:hover{background:rgba(34,211,238,.1);box-shadow:inset 0 0 24px rgba(34,211,238,.15)}
.btn.danger{background:linear-gradient(100deg,var(--red),#ff7a90 48%,var(--red));color:#150207}

.iconbtn{
  padding:8px 12px;color:var(--cy);font-family:var(--mono);font-size:13px;
  border:1px solid var(--line-2);background:rgba(34,211,238,.05);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  transition:.16s;
}
.iconbtn:hover{background:rgba(34,211,238,.16)}

.hint{color:var(--dim);font-family:var(--mono);font-size:11.5px;line-height:1.75}

/* ============ 登入 ============ */
.gate{max-width:400px;margin:0 auto;padding:52px 22px}
.brand{
  margin:0 0 6px;font-family:var(--disp);font-weight:900;font-size:42px;
  letter-spacing:.04em;line-height:.96;color:var(--ink);
  text-shadow:0 0 14px rgba(34,211,238,.45);
}
.brand span{color:var(--cy)}
.rule{
  height:1px;margin:18px 0 26px;
  background:linear-gradient(90deg,var(--cy),transparent 72%);
}
.id-input{
  font-size:44px!important;text-align:center;letter-spacing:.3em;
  padding:16px 0 16px .3em!important;font-family:var(--disp)!important;font-weight:900;
  color:var(--cy)!important;text-shadow:0 0 18px rgba(34,211,238,.55);
}

/* ============ 牌桌 ============ */
.table-wrap{position:relative;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.topbar{
  display:flex;align-items:center;gap:11px;padding:11px 15px;flex:none;
  border-bottom:1px solid var(--line);background:rgba(4,8,12,.75);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.topbar .code{
  font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--cy);
}
.topbar .spacer{flex:1}
.chip-icon{
  width:8px;height:8px;display:inline-block;background:var(--cy);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  box-shadow:0 0 10px var(--cy);animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 狀態條 */
.mybar{display:flex;gap:1px;padding:0;flex:none;border-bottom:1px solid var(--line);background:rgba(4,8,12,.6)}
.mybar .box{
  flex:1;text-align:center;padding:9px 3px;position:relative;
  background:rgba(10,18,26,.6);
}
.mybar .box+.box::before{
  content:'';position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--line);
}
.mybar .k{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.2em}
.mybar .v{font-family:var(--disp);font-size:17px;font-weight:700;line-height:1.4;color:var(--cy);text-shadow:0 0 12px rgba(34,211,238,.45)}
.mybar .v.small{font-size:12px;letter-spacing:.04em;color:var(--ink);text-shadow:none}
.mybar .v.now{color:var(--am);text-shadow:0 0 14px rgba(255,176,32,.7);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* 桌面 */
.felt{
  position:relative;flex:1;margin:14px;min-height:330px;
  --notch:26px;clip-path:var(--cut);
  background:
    repeating-linear-gradient(0deg,rgba(34,211,238,.028) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(34,211,238,.028) 0 1px,transparent 1px 26px),
    radial-gradient(ellipse at 50% 42%,#0d2a33,#071620 58%,#04080e);
  border:1px solid var(--line-2);
}
/* 同心技術圈 + 刻度 */
.felt::before{
  content:'';position:absolute;left:50%;top:43%;width:min(76%,430px);aspect-ratio:1/.62;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  border:1px solid rgba(34,211,238,.14);
  box-shadow:0 0 0 1px rgba(34,211,238,.05) inset,
             0 0 60px rgba(34,211,238,.07) inset;
  background:
    repeating-conic-gradient(from 0deg,rgba(34,211,238,.3) 0 .45deg,transparent .45deg 7.5deg);
  mask-image:radial-gradient(closest-side,transparent 88%,#000 89%,#000 100%);
  -webkit-mask-image:radial-gradient(closest-side,transparent 88%,#000 89%,#000 100%);
  animation:sweepring 34s linear infinite;
}
@keyframes sweepring{to{transform:translate(-50%,-50%) rotate(360deg)}}
/* 雷達掃描 */
.felt::after{
  content:'';position:absolute;left:50%;top:43%;width:min(70%,400px);aspect-ratio:1/.62;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:conic-gradient(from var(--ang),rgba(34,211,238,.16),transparent 46deg,transparent 360deg);
  animation:spin 6.5s linear infinite;
  mask-image:radial-gradient(closest-side,#000 30%,transparent 92%);
  -webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent 92%);
}

.center{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;width:74%;z-index:3}
.pot-label{font-family:var(--mono);color:var(--dim);font-size:10px;letter-spacing:.4em}
.pot{
  font-family:var(--disp);font-weight:900;font-size:46px;line-height:1.06;
  color:var(--am);letter-spacing:.01em;
  text-shadow:0 0 4px rgba(255,176,32,.9),0 0 26px rgba(255,176,32,.4);
  font-variant-numeric:tabular-nums;
}
.pot.bump{animation:bump .32s ease-out}
@keyframes bump{0%{transform:scale(1)}36%{transform:scale(1.11)}100%{transform:scale(1)}}

.stack{display:flex;justify-content:center;gap:2px;height:15px;margin-top:9px}
.stack i{
  width:20px;height:5px;align-self:flex-end;background:var(--am);
  clip-path:polygon(2px 0,100% 0,calc(100% - 2px) 100%,0 100%);
  box-shadow:0 0 9px rgba(255,176,32,.75);
  animation:rise .3s cubic-bezier(.2,1.6,.4,1) backwards;
}
.stack i:nth-child(even){background:var(--cy);box-shadow:0 0 9px rgba(34,211,238,.75);height:7px}
@keyframes rise{from{transform:translateY(12px) scaleX(.2);opacity:0}}

.phase{font-family:var(--mono);color:var(--dim);font-size:11px;margin-top:8px;letter-spacing:.2em}
.sidepots{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:5px;letter-spacing:.06em}

/* 座位 */
.seat{position:absolute;transform:translate(-50%,-50%);width:94px;text-align:center;z-index:4}
.seat .card{
  position:relative;padding:8px 5px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  background:linear-gradient(170deg,rgba(10,22,30,.94),rgba(5,10,16,.94));
  border:1px solid var(--line);
  transition:transform .2s;
}
.seat.empty .card{border-style:dashed;opacity:.35}
.seat.folded{opacity:.28;filter:grayscale(1)}
.seat.me .card{border-color:rgba(155,255,77,.4)}
.seat.me .card::before{
  content:'';position:absolute;left:-1px;top:20%;bottom:20%;width:2px;background:var(--li);
  box-shadow:0 0 10px var(--li);
}

.seat.turn{z-index:6}
.seat.turn .card{transform:scale(1.1);border-color:var(--cy);box-shadow:0 0 0 1px rgba(34,211,238,.35),0 0 26px rgba(34,211,238,.3)}
/* 轉動的準星環 */
.seat.turn::before{
  content:'';position:absolute;left:50%;top:50%;width:118%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  border:1px dashed rgba(34,211,238,.6);
  animation:spin2 3.4s linear infinite;
}
@keyframes spin2{to{transform:translate(-50%,-50%) rotate(360deg)}}

.seat .nm{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ch{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--am);text-shadow:0 0 10px rgba(255,176,32,.5);font-variant-numeric:tabular-nums}
.seat .st{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.1em}
.seat .allin{
  font-family:var(--disp);font-weight:900;font-size:9.5px;color:var(--red);
  letter-spacing:.14em;text-shadow:0 0 10px rgba(255,59,92,.9);animation:blink 1.1s steps(2) infinite;
}
.seat .bet{
  margin-top:6px;font-family:var(--mono);font-size:11px;color:#04060a;font-weight:700;
  background:var(--am);padding:2px 9px;display:inline-block;
  clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);
  box-shadow:0 0 12px rgba(255,176,32,.55);
  animation:pop .24s cubic-bezier(.2,1.7,.4,1);
}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.seat .tag{
  position:absolute;top:-8px;right:-6px;font-family:var(--disp);font-size:9px;font-weight:900;
  color:#04060a;padding:2px 6px;letter-spacing:.08em;background:var(--cy);
  clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%);
  box-shadow:0 0 12px rgba(34,211,238,.75);
}

/* 動作列 */
.actions{
  flex:none;padding:11px 13px 18px;
  border-top:1px solid var(--line);background:rgba(4,8,12,.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.act-row{display:flex;gap:9px}
.act-row .btn{padding:17px 6px;font-size:13px}
.raise-box{display:none;margin-bottom:10px}
.raise-box.on{display:block;animation:slideUp .2s ease-out}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}}
.raise-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.raise-top input[type=number]{
  flex:1;padding:11px;text-align:center;
  font-family:var(--disp);font-weight:900;font-size:20px;color:var(--am);
  background:rgba(0,0,0,.6);border:1px solid rgba(255,176,32,.35);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  text-shadow:0 0 14px rgba(255,176,32,.6);
}
.quick{display:flex;gap:6px}
.quick button{
  flex:1;padding:9px 2px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:var(--cy);border:1px solid var(--line);background:rgba(34,211,238,.045);
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  transition:.15s;
}
.quick button:hover{background:rgba(34,211,238,.18)}
input[type=range]{width:100%;accent-color:var(--cy);height:26px}
.waiting{
  text-align:center;color:var(--dim);font-family:var(--mono);
  padding:17px 0;font-size:12px;letter-spacing:.16em;
}

/* 抽屜 */
.drawer{position:fixed;inset:0;z-index:60;background:rgba(2,4,8,.78);display:none;backdrop-filter:blur(4px)}
.drawer.on{display:block;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.drawer-inner{
  position:absolute;right:0;top:0;bottom:0;width:min(410px,93vw);padding:20px;overflow-y:auto;
  background:linear-gradient(200deg,rgba(9,18,26,.98),rgba(4,7,12,.99));
  border-left:1px solid var(--line-2);
  animation:slideIn .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideIn{from{transform:translateX(100%)}}
.drawer h3{margin:0 0 4px;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.08em}
.drawer .sec{
  margin:22px 0 9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--cy);
  display:flex;align-items:center;gap:9px;
}
.drawer .sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}

.pot-award{
  border:1px solid rgba(255,176,32,.26);padding:13px;margin-bottom:11px;
  background:rgba(255,176,32,.04);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
}
.pot-award .h{font-family:var(--disp);font-weight:700;color:var(--am);margin-bottom:10px;font-size:12.5px;letter-spacing:.1em}
.winner-pick{display:flex;flex-wrap:wrap;gap:7px}
.winner-pick button{
  padding:10px 13px;font-size:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  transition:.15s;
}
.winner-pick button.on{
  background:var(--am);color:#04060a;font-weight:800;border-color:transparent;
  box-shadow:0 0 20px rgba(255,176,32,.6);
}

.logbox{
  font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.9;
  max-height:200px;overflow-y:auto;
  border-left:1px solid var(--line-2);padding-left:12px;
}

.toast{
  position:fixed;left:50%;bottom:100px;transform:translate(-50%,14px);
  padding:12px 19px;font-size:13px;z-index:200;
  background:rgba(8,16,22,.96);border:1px solid var(--line-2);color:var(--ink);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,59,92,.6);color:#ffb3bf}

.banner{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;
  background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.5);
  color:#ffb3bf;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  padding:8px 14px;white-space:nowrap;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  animation:blink 1.8s steps(2) infinite;
}

/* 贏牌 */
#burst{position:fixed;inset:0;pointer-events:none;z-index:800;display:none}
#burst.on{display:block}
#burst i{
  position:absolute;left:50%;top:44%;width:3px;height:12px;background:var(--am);
  box-shadow:0 0 10px var(--am);
  animation:fly .9s cubic-bezier(.15,.7,.3,1) forwards;
}
@keyframes fly{
  0%{transform:translate(-50%,-50%) scaleY(.3);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scaleY(1.4) rotate(var(--rot));opacity:0}
}

/* ============ 後台 ============ */
.admin{max-width:660px;margin:0 auto;padding:22px 18px 74px}
.admin h1{
  font-family:var(--disp);font-weight:900;font-size:24px;margin:6px 0 6px;
  color:var(--ink);letter-spacing:.06em;text-shadow:0 0 14px rgba(34,211,238,.4);
}
.admin h1 span{color:var(--cy)}
.prow{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid rgba(34,211,238,.09)}
.prow .id{font-family:var(--disp);font-weight:900;font-size:16px;min-width:38px;text-align:center;color:var(--cy)}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-size:13.5px;font-weight:600}
.prow .who small{color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.08em}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* engine.js — 純籌碼引擎，不碰 Firebase。
   輸入 state + action，輸出新的 state。可以單獨測試。 */
(function (g) {
  'use strict';
  var E = {};

  var PHASES = ['preflop', 'flop', 'turn', 'river'];

  E.defaultSettings = function () {
    return {
      seatCount: 9,
      sb: 25,
      bb: 50,
      startingChips: 5000,
      joinMode: 'anyone',      // anyone | hostOnly
      lateEntry: 'postBB',     // postBB | waitBB
      disconnectSec: 30
    };
  };

  E.newRoom = function (settings) {
    return {
      status: 'lobby',
      settings: settings,
      seats: Array.from({ length: settings.seatCount }, function () { return null; }),
      hand: {
        no: 0, dealerSeat: -1, sbSeat: -1, bbSeat: -1,
        phase: 'idle', turnSeat: -1, currentBet: 0, minRaise: settings.bb
      },
      pots: [],
      pendingAward: null,
      log: []
    };
  };

  E.newPlayer = function (uid, name, chips, seat) {
    return {
      uid: uid, name: name, chips: chips, seat: seat,
      bet: 0, committed: 0,
      folded: false, allIn: false, acted: false,
      state: 'waiting',        // playing | waiting | sitout
      waitFromDealer: -1,
      lastSeen: Date.now()
    };
  };

  /* ---------- 查詢 ---------- */
  function inHand(s) { return s && s.state === 'playing' && !s.folded; }
  function canAct(s) { return inHand(s) && !s.allIn && s.chips > 0; }
  function seatedPlaying(s) { return s && s.state === 'playing'; }

  function countWhere(seats, fn) {
    var c = 0;
    for (var i = 0; i < seats.length; i++) if (fn(seats[i])) c++;
    return c;
  }

  function nextIdx(seats, from, pred) {
    var n = seats.length;
    for (var k = 1; k <= n; k++) {
      var i = ((from % n) + n + k) % n;
      if (pred(seats[i], i)) return i;
    }
    return -1;
  }

  /* 從 a 出發往前走，是否會在到達 b 之前（含 b）經過 x */
  function arcContains(n, a, b, x) {
    for (var k = 1; k <= n; k++) {
      var i = (a + k) % n;
      if (i === x) return true;
      if (i === b) return false;
    }
    return false;
  }

  E.seatOf = function (st, uid) {
    for (var i = 0; i < st.seats.length; i++) if (st.seats[i] && st.seats[i].uid === uid) return i;
    return -1;
  };

  function log(st, text) {
    st.log = (st.log || []).concat([{ t: Date.now(), text: text }]).slice(-25);
  }

  /* ---------- 入座 / 離座 ---------- */
  E.sit = function (st, uid, name, seat) {
    if (seat < 0 || seat >= st.seats.length) throw new Error('座位不存在');
    if (st.seats[seat]) throw new Error('這個位子有人了');
    if (E.seatOf(st, uid) >= 0) throw new Error('你已經在桌上了');
    var p = E.newPlayer(uid, name, st.settings.startingChips, seat);
    if (st.hand.phase === 'idle') {
      p.state = 'playing';
    } else {
      p.state = 'waiting';
      p.waitFromDealer = st.hand.dealerSeat;
    }
    st.seats[seat] = p;
    log(st, name + ' 坐上 ' + (seat + 1) + ' 號位');
    return st;
  };

  E.leave = function (st, seat) {
    var p = st.seats[seat];
    if (!p) return st;
    if (st.hand.phase !== 'idle' && inHand(p)) {
      p.folded = true; p.acted = true;
      p.state = 'sitout';
      log(st, p.name + ' 離桌（視同蓋牌）');
      if (st.hand.turnSeat === seat) advanceTurnOrStreet(st);
      return st;
    }
    log(st, p.name + ' 離桌');
    st.seats[seat] = null;
    return st;
  };

  E.move = function (st, from, to) {
    if (st.hand.phase !== 'idle') throw new Error('牌局進行中不能換位，下一手才生效');
    if (!st.seats[from]) throw new Error('那個位子沒人');
    if (st.seats[to]) throw new Error('目標位子有人');
    st.seats[to] = st.seats[from];
    st.seats[to].seat = to;
    st.seats[from] = null;
    log(st, st.seats[to].name + ' 換到 ' + (to + 1) + ' 號位');
    return st;
  };

  E.setSitout = function (st, seat, out) {
    var p = st.seats[seat];
    if (!p) return st;
    if (out) {
      if (inHand(p) && st.hand.phase !== 'idle') { p.folded = true; p.acted = true; }
      p.state = 'sitout';
      log(st, p.name + ' 暫離');
      if (st.hand.turnSeat === seat) advanceTurnOrStreet(st);
    } else {
      p.state = st.hand.phase === 'idle' ? 'playing' : 'waiting';
      p.waitFromDealer = st.hand.dealerSeat;
      log(st, p.name + ' 回桌');
    }
    return st;
  };

  E.addChips = function (st, seat, amount) {
    var p = st.seats[seat];
    if (!p) throw new Error('那個位子沒人');
    p.chips += amount;
    if (p.state === 'sitout' && p.chips > 0) {
      p.state = st.hand.phase === 'idle' ? 'playing' : 'waiting';
      p.waitFromDealer = st.hand.dealerSeat;
    }
    log(st, p.name + ' 補碼 ' + amount);
    return st;
  };

  /* ---------- 開新一手 ---------- */
  E.startHand = function (st, forcedDealer) {
    if (st.hand.phase !== 'idle') throw new Error('上一手還沒結束');
    var n = st.seats.length, i;

    // 沒籌碼的自動暫離
    for (i = 0; i < n; i++) {
      var s = st.seats[i];
      if (s && s.chips <= 0 && s.state !== 'sitout') { s.state = 'sitout'; }
    }

    var prevDealer = st.hand.dealerSeat;
    var dealerSeat;
    if (typeof forcedDealer === 'number' && forcedDealer >= 0) {
      if (!seatedPlaying(st.seats[forcedDealer])) throw new Error('指定的莊家位沒有在玩的人');
      dealerSeat = forcedDealer;
    } else {
      dealerSeat = nextIdx(st.seats, prevDealer < 0 ? n - 1 : prevDealer, seatedPlaying);
    }
    if (dealerSeat < 0) throw new Error('桌上人不夠');

    // 補位者入場判定
    for (i = 0; i < n; i++) {
      var w = st.seats[i];
      if (!w || w.state !== 'waiting' || w.chips <= 0) continue;
      if (st.settings.lateEntry === 'postBB') {
        w.state = 'playing';
        w.pendingDead = st.settings.bb;   // 補一個大盲當死錢
      } else {
        var from = w.waitFromDealer < 0 ? prevDealer : w.waitFromDealer;
        if (from < 0 || arcContains(n, from, dealerSeat, i) || from === dealerSeat) {
          w.state = 'playing';
        }
      }
    }

    var playing = [];
    for (i = 0; i < n; i++) if (seatedPlaying(st.seats[i]) && st.seats[i].chips > 0) playing.push(i);
    if (playing.length < 2) throw new Error('至少要兩個有籌碼的人才能開牌');
    if (!seatedPlaying(st.seats[dealerSeat]) || st.seats[dealerSeat].chips <= 0) {
      dealerSeat = nextIdx(st.seats, dealerSeat, function (s) { return seatedPlaying(s) && s.chips > 0; });
    }

    var headsUp = playing.length === 2;
    var sbSeat, bbSeat;
    if (headsUp) {
      sbSeat = dealerSeat;
      bbSeat = nextIdx(st.seats, dealerSeat, function (s) { return seatedPlaying(s) && s.chips > 0; });
    } else {
      sbSeat = nextIdx(st.seats, dealerSeat, function (s) { return seatedPlaying(s) && s.chips > 0; });
      bbSeat = nextIdx(st.seats, sbSeat, function (s) { return seatedPlaying(s) && s.chips > 0; });
    }

    // 重置
    for (i = 0; i < n; i++) {
      var p = st.seats[i];
      if (!p) continue;
      p.bet = 0; p.committed = 0; p.folded = false; p.allIn = false; p.acted = false;
      if (p.state === 'playing' && p.chips <= 0) p.state = 'sitout';
    }

    st.hand = {
      no: st.hand.no + 1,
      dealerSeat: dealerSeat, sbSeat: sbSeat, bbSeat: bbSeat,
      phase: 'preflop', turnSeat: -1,
      currentBet: 0, minRaise: st.settings.bb
    };
    st.pots = [];
    st.pendingAward = null;
    st.status = 'playing';

    // 死錢（補大盲入場）
    for (i = 0; i < n; i++) {
      var d = st.seats[i];
      if (d && d.pendingDead && i !== sbSeat && i !== bbSeat) {
        var amt = Math.min(d.pendingDead, d.chips);
        d.chips -= amt; d.committed += amt;
        if (d.chips === 0) d.allIn = true;
        log(st, d.name + ' 補大盲入場 ' + amt);
      }
      if (d) delete d.pendingDead;
    }

    postBlind(st, sbSeat, st.settings.sb, '小盲');
    postBlind(st, bbSeat, st.settings.bb, '大盲');
    st.hand.currentBet = st.settings.bb;
    st.hand.minRaise = st.settings.bb;

    st.hand.turnSeat = headsUp
      ? sbSeat
      : nextIdx(st.seats, bbSeat, canAct);

    // 貼完盲注就全下的話，這個位子其實不能動作，往下找
    if (st.hand.turnSeat >= 0 && !canAct(st.seats[st.hand.turnSeat])) {
      st.hand.turnSeat = nextIdx(st.seats, st.hand.turnSeat, canAct);
    }
    if (st.hand.turnSeat < 0 || roundDone(st)) settleStreet(st);
    log(st, '— 第 ' + st.hand.no + ' 手開始，莊家 ' + (dealerSeat + 1) + ' 號位 —');
    return st;
  };

  function postBlind(st, seat, amount, label) {
    var p = st.seats[seat];
    if (!p) return;
    var pay = Math.min(amount, p.chips);
    p.chips -= pay; p.bet += pay;
    if (p.chips === 0) p.allIn = true;
    log(st, p.name + ' ' + label + ' ' + pay);
  }

  /* ---------- 玩家動作 ---------- */
  E.act = function (st, seat, type, amount) {
    var p = st.seats[seat];
    if (!p) throw new Error('那個位子沒人');
    if (st.hand.phase === 'idle' || st.hand.phase === 'showdown') throw new Error('現在不能動作');
    if (st.hand.turnSeat !== seat) throw new Error('還沒輪到你');
    if (!canAct(p)) throw new Error('你現在不能動作');

    var need = st.hand.currentBet - p.bet;

    if (type === 'fold') {
      p.folded = true; p.acted = true;
      log(st, p.name + ' 蓋牌');

    } else if (type === 'check') {
      if (need > 0) throw new Error('有人下注了，不能過牌');
      p.acted = true;
      log(st, p.name + ' 過牌');

    } else if (type === 'call') {
      var pay = Math.min(need, p.chips);
      p.chips -= pay; p.bet += pay; p.acted = true;
      if (p.chips === 0) p.allIn = true;
      log(st, p.name + (pay === 0 ? ' 過牌' : (p.allIn ? ' 全下跟注 ' : ' 跟注 ') + fmtn(pay)));

    } else if (type === 'raise' || type === 'bet' || type === 'allin') {
      var target;
      if (type === 'allin') {
        target = p.bet + p.chips;
      } else {
        target = Math.round(amount);
        if (!(target > 0)) throw new Error('金額不對');
        if (target > p.bet + p.chips) throw new Error('籌碼不夠');
      }
      var isAllIn = target === p.bet + p.chips;

      // 全下但蓋不過目前注額 → 等同全下跟注，不是加注
      if (target <= st.hand.currentBet) {
        if (!isAllIn) throw new Error('加注要大於目前注額');
        var short = p.chips;
        p.chips = 0; p.bet += short; p.allIn = true; p.acted = true;
        log(st, p.name + ' 全下跟注 ' + fmtn(short));
        advanceTurnOrStreet(st);
        return st;
      }

      var inc = target - st.hand.currentBet;
      if (inc < st.hand.minRaise && !isAllIn) {
        throw new Error('最少要加到 ' + fmtn(st.hand.currentBet + st.hand.minRaise));
      }
      var delta = target - p.bet;
      p.chips -= delta; p.bet = target;
      if (p.chips === 0) p.allIn = true;

      if (inc >= st.hand.minRaise) {
        st.hand.minRaise = inc;
        // 完整加注 → 其他人重新取得行動權
        for (var i = 0; i < st.seats.length; i++) {
          var o = st.seats[i];
          if (o && i !== seat && canAct(o)) o.acted = false;
        }
      }
      st.hand.currentBet = target;
      p.acted = true;
      log(st, p.name + (p.allIn ? ' 全下 ' : ' 加注到 ') + fmtn(target));

    } else {
      throw new Error('未知的動作');
    }

    advanceTurnOrStreet(st);
    return st;
  };

  function fmtn(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  /* ---------- 流程推進 ---------- */
  function roundDone(st) {
    var live = [];
    for (var i = 0; i < st.seats.length; i++) if (canAct(st.seats[i])) live.push(st.seats[i]);
    if (countWhere(st.seats, inHand) <= 1) return true;
    if (live.length === 0) return true;
    for (var j = 0; j < live.length; j++) {
      if (!live[j].acted || live[j].bet !== st.hand.currentBet) return false;
    }
    return true;
  }

  function advanceTurnOrStreet(st) {
    if (countWhere(st.seats, inHand) <= 1) { settleStreet(st); return; }
    if (roundDone(st)) { settleStreet(st); return; }
    var nxt = nextIdx(st.seats, st.hand.turnSeat, canAct);
    st.hand.turnSeat = nxt;
    if (nxt < 0) settleStreet(st);
  }

  function collectBets(st) {
    for (var i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (!p) continue;
      p.committed += p.bet;
      p.bet = 0;
      p.acted = false;
    }
    st.hand.currentBet = 0;
    st.hand.minRaise = st.settings.bb;
  }

  /* 沒人跟得起的那一段下注要退回去，不能留在池子裡 */
  function refundUncalled(st) {
    var idx = -1, max = -1, second = -1, i;
    for (i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (!p) continue;
      var c = p.committed;
      if (c > max) { second = max; max = c; idx = i; }
      else if (c > second) { second = c; }
    }
    if (idx < 0 || second < 0 || max <= second) return;
    var back = max - second;
    var w = st.seats[idx];
    w.chips += back;
    w.committed = second;
    w.allIn = w.chips === 0;
    log(st, w.name + ' 沒人跟，退回 ' + fmtn(back));
  }

  function settleStreet(st) {
    collectBets(st);
    refundUncalled(st);

    // 只剩一個人沒蓋牌 → 直接結算
    if (countWhere(st.seats, inHand) <= 1) {
      var winner = -1;
      for (var i = 0; i < st.seats.length; i++) if (inHand(st.seats[i])) winner = i;
      st.pots = E.buildPots(st.seats);
      st.hand.phase = 'showdown';
      st.hand.turnSeat = -1;
      if (winner >= 0) {
        st.pendingAward = { pots: st.pots, resolved: st.pots.map(function () { return null; }) };
        for (var k = 0; k < st.pots.length; k++) E.award(st, k, [winner]);
      }
      return;
    }

    var canActCount = countWhere(st.seats, canAct);
    var idx = PHASES.indexOf(st.hand.phase);

    // 大家都 all-in → 直接跳到攤牌
    if (canActCount <= 1) {
      var stillNeeds = false;
      for (var m = 0; m < st.seats.length; m++) {
        var q = st.seats[m];
        if (canAct(q) && q.committed < maxCommitted(st)) stillNeeds = true;
      }
      if (!stillNeeds) { toShowdown(st); return; }
    }

    if (idx >= PHASES.length - 1) { toShowdown(st); return; }

    st.hand.phase = PHASES[idx + 1];
    var first = nextIdx(st.seats, st.hand.dealerSeat, canAct);
    st.hand.turnSeat = countWhere(st.seats, canAct) >= 2 ? first : -1;
    log(st, '— ' + phaseName(st.hand.phase) + ' —');
    if (st.hand.turnSeat < 0) settleStreet(st);
  }

  function maxCommitted(st) {
    var mx = 0;
    for (var i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (p && inHand(p)) mx = Math.max(mx, p.committed);
    }
    return mx;
  }

  function phaseName(p) {
    return { preflop: '翻牌前', flop: '翻牌', turn: '轉牌', river: '河牌', showdown: '攤牌' }[p] || p;
  }
  E.phaseName = phaseName;

  function toShowdown(st) {
    st.hand.phase = 'showdown';
    st.hand.turnSeat = -1;
    st.pots = E.buildPots(st.seats);
    st.pendingAward = { pots: st.pots, resolved: st.pots.map(function () { return null; }) };
    log(st, '— 攤牌，請房主選出贏家 —');
  }

  /* ---------- 邊池 ---------- */
  E.buildPots = function (seats) {
    var contrib = seats.map(function (s) { return s ? s.committed + s.bet : 0; });
    var alive = seats.map(function (s) { return !!(s && s.state === 'playing' && !s.folded); });

    var levels = [];
    contrib.forEach(function (c) { if (c > 0 && levels.indexOf(c) < 0) levels.push(c); });
    levels.sort(function (a, b) { return a - b; });

    var pots = [], prev = 0;
    levels.forEach(function (lv) {
      var amount = 0, elig = [];
      contrib.forEach(function (c, i) {
        amount += Math.min(c, lv) - Math.min(c, prev);
        if (c >= lv && alive[i]) elig.push(i);
      });
      if (amount > 0) pots.push({ amount: amount, eligible: elig });
      prev = lv;
    });

    // 合併資格相同的相鄰池
    var merged = [];
    pots.forEach(function (p) {
      var last = merged[merged.length - 1];
      if (last && (p.eligible.length === 0 || last.eligible.join(',') === p.eligible.join(','))) {
        last.amount += p.amount;
      } else {
        merged.push({ amount: p.amount, eligible: p.eligible.slice() });
      }
    });
    return merged;
  };

  /* ---------- 分池 ---------- */
  E.award = function (st, potIndex, winnerSeats) {
    if (!st.pendingAward) throw new Error('現在沒有要分的池');
    var pot = st.pendingAward.pots[potIndex];
    if (!pot) throw new Error('池不存在');
    if (st.pendingAward.resolved[potIndex]) throw new Error('這個池已經分過了');
    if (!winnerSeats.length) throw new Error('要選至少一個贏家');
    for (var i = 0; i < winnerSeats.length; i++) {
      if (pot.eligible.indexOf(winnerSeats[i]) < 0) throw new Error('有人沒有這個池的資格');
    }

    var each = Math.floor(pot.amount / winnerSeats.length);
    var rem = pot.amount - each * winnerSeats.length;
    var ordered = orderFromDealer(st, winnerSeats);
    ordered.forEach(function (seat, k) {
      st.seats[seat].chips += each + (k < rem ? 1 : 0);
    });
    st.pendingAward.resolved[potIndex] = ordered.slice();
    log(st, (potIndex === 0 ? '主池 ' : '邊池' + potIndex + ' ') + fmtn(pot.amount) + ' → ' +
      ordered.map(function (s) { return st.seats[s].name; }).join('、'));

    var allDone = st.pendingAward.resolved.every(function (r) { return !!r; });
    if (allDone) endHand(st);
    return st;
  };

  function orderFromDealer(st, seats) {
    var n = st.seats.length, d = st.hand.dealerSeat;
    return seats.slice().sort(function (a, b) {
      return ((a - d + n) % n) - ((b - d + n) % n);
    });
  }

  function endHand(st) {
    var results = [];
    for (var i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (!p) continue;
      results.push({ uid: p.uid, name: p.name, spent: p.committed + p.bet, chips: p.chips });
      p.bet = 0; p.committed = 0; p.folded = false; p.allIn = false; p.acted = false;
      if (p.chips <= 0) p.state = 'sitout';
      else if (p.state === 'playing') p.state = 'playing';
    }
    st.hand.phase = 'idle';
    st.hand.turnSeat = -1;
    st.pots = [];
    st.pendingAward = null;
    st.lastResults = results;
  }

  /* ---------- 給 UI 用的輔助 ---------- */
  E.potTotal = function (st) {
    var t = 0;
    for (var i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (p) t += p.committed + p.bet;
    }
    return t;
  };

  E.legalMoves = function (st, seat) {
    var p = st.seats[seat];
    var out = { fold: false, check: false, call: 0, minRaise: 0, maxRaise: 0 };
    if (!p || st.hand.turnSeat !== seat || !canAct(p)) return out;
    var need = st.hand.currentBet - p.bet;
    out.fold = true;
    out.check = need === 0;
    out.call = Math.min(need, p.chips);
    out.maxRaise = p.bet + p.chips;
    var min = st.hand.currentBet + st.hand.minRaise;
    out.minRaise = Math.min(min, out.maxRaise);
    if (out.maxRaise <= st.hand.currentBet) { out.minRaise = 0; out.maxRaise = 0; }
    return out;
  };

  /* 還要幾手才輪到你當大盲／小盲。0 = 這一手就是你 */
  E.handsUntil = function (st, seat, which) {
    var active = [], i;
    for (i = 0; i < st.seats.length; i++) {
      var s = st.seats[i];
      if (s && s.state === 'playing' && s.chips > 0) active.push(i);
    }
    if (active.length < 2) return -1;
    var mi = active.indexOf(seat);
    if (mi < 0) return -1;
    var ref = which === 'sb' ? st.hand.sbSeat : st.hand.bbSeat;
    var ri = active.indexOf(ref);
    if (ri < 0) return -1;
    return ((mi - ri) % active.length + active.length) % active.length;
  };

  E.positionLabel = function (st, seat) {
    if (st.hand.phase === 'idle') return '';
    if (seat === st.hand.dealerSeat) return 'D';
    if (seat === st.hand.sbSeat) return 'SB';
    if (seat === st.hand.bbSeat) return 'BB';
    return '';
  };

  g.Engine = E;
})(window);

</script>

}

var ST = null, queue = Promise.resolve(), seen = {}, beatTimer = null, awardPick = {};

  TABLE.get().then(function (s) {

    TABLE.collection('actions').orderBy('ts', 'asc').onSnapshot(function (snap) {
      snap.docChanges().forEach(function (ch) {
        if (ch.type === 'removed') return;
        var doc = ch.doc;
        if (!doc.data().ts) return;      // serverTimestamp 還沒落地
        if (seen[doc.id]) return;
        seen[doc.id] = true;
        enqueue(doc);
      });
    }, function (e) { console.warn(e); });
  });

function normalize(d) {
  return {
    status: d.status, settings: d.settings, seats: d.seats || [], hand: d.hand,
    pots: d.pots || [], pendingAward: d.pendingAward || null, log: d.log || []
  };
}

function beat() { TABLE.update({ hostHeartbeat: FV.serverTimestamp() }).catch(function () {}); }

function enqueue(doc) {
  queue = queue.then(function () {
    var a = doc.data(), err = null;
    try { applyAction(a); } catch (e) { err = e.message || String(e); }
    var jobs = [doc.ref.delete().catch(function () {})];
    if (err) {
      jobs.push(TABLE.collection('errors').doc(String(a.id))
        .set({ msg: err, at: FV.serverTimestamp() }).catch(function () {}));
    } else {
      jobs.push(flush());
    }
    return Promise.all(jobs);
  }).catch(function (e) { console.warn(e); });
  return queue;
}

function applyAction(a) {
  var seat = Engine.seatOf(ST, a.id);
  switch (a.type) {
    case 'sitout':
      if (seat < 0) throw new Error('你不在桌上');
      Engine.setSitout(ST, seat, !!a.value);
      break;
    case 'fold': case 'check': case 'call': case 'raise': case 'allin':
      if (seat < 0) throw new Error('你不在桌上');
      Engine.act(ST, seat, a.type, a.amount);
      break;
    default:
      throw new Error('未知動作 ' + a.type);
  }
}

  queue = queue.then(function () {

    return flush();

}

function renderHandPanel() {
  var el = $('handPanel'), h = '';

  if (ST.pendingAward) {
    h += '<h2>選出贏家</h2>';

      var done = ST.pendingAward.resolved[i];

        h += '<div class="hint">已分給 ' + done.map(function (s) {

function bindHandPanel() {

    var fd = +$('forceDealer').value;

      .catch(function (e) { toast(e.message, 'bad'); });

  if ($('abortHand')) $('abortHand').onclick = function () {
    if (!confirm('作廢這一手？所有人下的注會原數退回。')) return;
    hostOp(function (st) {
      st.seats.forEach(function (p) {

    });

  var el = $('handPanel');
  Array.prototype.slice.call(el.querySelectorAll('[data-pot]')).forEach(function (b) {
    b.onclick = function () {
      var pi = +b.getAttribute('data-pot'), s = +b.getAttribute('data-seat');
      awardPick[pi] = awardPick[pi] || [];
      var k = awardPick[pi].indexOf(s);
      if (k >= 0) awardPick[pi].splice(k, 1); else awardPick[pi].push(s);
      renderHandPanel();
    };
  });
  Array.prototype.slice.call(el.querySelectorAll('[data-award]')).forEach(function (b) {
    b.onclick = function () {
      var pi = +b.getAttribute('data-award'), w = awardPick[pi] || [];
      if (!w.length) return toast('先點贏家', 'bad');

        .then(function () { awardPick = {}; })
        .catch(function (e) { toast(e.message, 'bad'); });

}

function renderPlayers() {
  var h = '';
  ST.seats.forEach(function (p, i) {
    if (!p) return;
    var out = p.chips <= 0;
    h += '<div class="prow' + (out ? ' out' : '') + '">' +
      '<span class="id">' + esc(p.uid) + '</span>' +
      '<span class="who"><b>' + esc(p.name) + '</b><small>' + (i + 1) + ' 號位' +
        (out ? '　已出局' : p.state === 'sitout' ? '　暫離' : p.state === 'waiting' ? '　下一手加入' : '') +
      '</small></span>' +
      '<span class="money">' + fmt(p.chips) + '</span>' +
      '<button data-add="' + i + '">補碼</button>' +
      '<button data-set="' + i + '">改碼</button>' +
      '<button data-pw="' + i + '">密碼</button>' +

  if (!h) h = '<p class="hint">還沒有人。用下面的欄位登記。</p>';
  $('playerList').innerHTML = h;

  var sel = $('newSeat'), opts = '';
  ST.seats.forEach(function (s, i) { if (!s) opts += '<option value="' + i + '">' + (i + 1) + ' 號</option>'; });
  sel.innerHTML = opts || '<option value="-1">沒有空位</option>';

  bindPlayers();
}

function bindPlayers() {
  var el = $('playerList');

  Array.prototype.slice.call(el.querySelectorAll('[data-add]')).forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-add');
      var v = prompt('補多少給 ' + ST.seats[i].name + '？', ST.settings.startingChips);
      if (!v) return;
      hostOp(function (st, E) { E.addChips(st, i, Math.round(+v)); })
        .catch(function (e) { toast(e.message, 'bad'); });
    };
  });

  Array.prototype.slice.call(el.querySelectorAll('[data-set]')).forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-set');
      var v = prompt('把 ' + ST.seats[i].name + ' 的籌碼直接改成？', ST.seats[i].chips);
      if (v === null) return;
      var n = Math.max(0, Math.round(+v));
      hostOp(function (st) {
        st.seats[i].chips = n;
        if (n > 0 && st.seats[i].state === 'sitout' && st.hand.phase === 'idle') st.seats[i].state = 'playing';
        st.log = (st.log || []).concat([{ t: Date.now(), text: st.seats[i].name + ' 籌碼調整為 ' + n }]).slice(-25);
      });
    };
  });

  Array.prototype.slice.call(el.querySelectorAll('[data-pw]')).forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-pw'), p = ST.seats[i];
      var ref = db.collection('roster').doc(String(p.uid)).collection('private').doc('pw');
      ref.get().then(function (s) {
        var cur = s.exists ? s.data().pw : null;
        var msg = cur === null
          ? p.name + ' 還沒設過密碼，他第一次登入時打的就是密碼。\n\n要現在幫他指定一組嗎？留空取消。'
          : p.name + ' 目前的密碼是：' + cur + '\n\n要改的話直接打新的，留空取消。';
        var v = prompt(msg, cur || '');
        if (!v) return;
        return ref.set({ pw: v }).then(function () {
          return db.collection('roster').doc(String(p.uid)).collection('claims').get();
        }).then(function (q) {
          // 舊裝置的登入憑證作廢，改過密碼要重新登入
          var jobs = [];
          q.forEach(function (d) { jobs.push(d.ref.delete().catch(function () {})); });
          return Promise.all(jobs);
        }).then(function () { toast(p.name + ' 的密碼改成 ' + v); });
      }).catch(function () { toast('讀不到密碼', 'bad'); });
    };
  });

  Array.prototype.slice.call(el.querySelectorAll('[data-del]')).forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-del');
      var p = ST.seats[i];
      if (!confirm('把 ' + p.name + '（編號 ' + p.uid + '）移出牌桌？\n\n登記名單會保留，密碼也還在。')) return;
      hostOp(function (st, E) { E.leave(st, i); })
        .catch(function (e) { toast(e.message, 'bad'); });
    };
  });
}

$('addPlayer').addEventListener('click', function () {
  var id = $('newId').value.trim(), name = $('newName').value.trim(), seat = +$('newSeat').value;
  if (!/^\d{2}$/.test(id)) return toast('編號要兩位數字，例如 07', 'bad');
  if (!name) return toast('要填名字', 'bad');
  if (seat < 0) return toast('沒有空位了', 'bad');
  if (Engine.seatOf(ST, id) >= 0) return toast('這個編號已經在桌上', 'bad');

  db.collection('roster').doc(id).get().then(function (s) {
    if (!s.exists) return db.collection('roster').doc(id).set({ name: name, bound: false });
    return db.collection('roster').doc(id).update({ name: name });
  }).then(function () {
    return hostOp(function (st, E) { E.sit(st, id, name, seat); });
  }).then(function () {
    $('newId').value = ''; $('newName').value = '';
    toast(name + ' 登記完成，坐 ' + (seat + 1) + ' 號位');
  }).catch(function (e) { toast(e.message || '登記失敗', 'bad'); });
});

function renderSettings() {
  if (document.activeElement && document.activeElement.closest &&
      document.activeElement.closest('.panel') === $('setSb').closest('.panel')) return;
  $('setSb').value = ST.settings.sb;
  $('setBb').value = ST.settings.bb;
  $('setStack').value = ST.settings.startingChips;
  $('setSeats').value = ST.settings.seatCount;
  $('setLate').value = ST.settings.lateEntry;
}

$('saveSettings').addEventListener('click', function () {
  var sb = Math.max(1, +$('setSb').value);
  var bb = Math.max(sb + 1, +$('setBb').value);
  var stack = Math.max(bb, +$('setStack').value);
  var seatCount = +$('setSeats').value;
  var late = $('setLate').value;

  for (var i = seatCount; i < ST.seats.length; i++) {
    if (ST.seats[i]) return toast('第 ' + (i + 1) + ' 號位還有人，先移除', 'bad');
  }
  hostOp(function (st) {
    st.settings.sb = sb; st.settings.bb = bb;
    st.settings.startingChips = stack; st.settings.lateEntry = late;
    if (seatCount !== st.seats.length) {
      var seats = st.seats.slice(0, seatCount);
      while (seats.length < seatCount) seats.push(null);
      st.seats = seats;
      st.settings.seatCount = seatCount;
    }
  }).then(function () { toast('設定已儲存，下一手生效'); });
});

$('aLogout').addEventListener('click', function () {
  clearInterval(beatTimer);
  location.reload();
});

})();
</script>
</body>
</html>
