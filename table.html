<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a09">
<title>牌桌</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="table-wrap">

  <div class="topbar">
    <span class="chip-icon"></span>
    <span class="code" id="roomCode">----</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="takeoverBtn" style="display:none">接管牌桌</button>
    <button class="iconbtn" id="drawerBtn">☰</button>
  </div>

  <div class="felt" id="felt">
    <div class="center">
      <div class="pot-label">底池</div>
      <div class="pot" id="pot">0</div>
      <div class="phase" id="phase">等待開牌</div>
      <div class="sidepots" id="sidepots"></div>
    </div>
    <div class="banner" id="banner" style="display:none"></div>
  </div>

  <div class="actions" id="actions">
    <div class="raise-box" id="raiseBox">
      <div class="raise-top">
        <input type="number" id="raiseVal" step="1">
        <button class="iconbtn" id="raiseCancel">取消</button>
      </div>
      <input type="range" id="raiseSlider">
      <div class="quick">
        <button data-q="min">最小</button>
        <button data-q="half">½ 池</button>
        <button data-q="pot">滿池</button>
        <button data-q="all">全下</button>
      </div>
    </div>
    <div id="actRow"></div>
  </div>

</div>

<div class="drawer" id="drawer">
  <div class="drawer-inner" id="drawerInner"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/host.js"></script>
<script src="js/table.js"></script>
</body>
</html>
