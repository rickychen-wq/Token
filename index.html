<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110d">
  <title>215 德州撲克</title>

  <style>
    :root {
      --bg: #050807;
      --panel: rgba(12, 24, 19, 0.82);
      --panel2: rgba(18, 40, 30, 0.75);
      --line: rgba(158, 255, 198, 0.14);
      --text: #f4fff8;
      --muted: #92aa9d;
      --green: #4cff9a;
      --green2: #19d978;
      --red: #ff6278;
      --gold: #ffd66b;
      --blue: #66b9ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      background:
        radial-gradient(circle at 20% 0%, rgba(30,226,125,.13), transparent 30%),
        radial-gradient(circle at 90% 15%, rgba(80,176,255,.09), transparent 25%),
        linear-gradient(180deg, #07110d, #050807);
    }

    .container {
      width: min(1100px, calc(100% - 22px));
      margin: auto;
      padding: 18px 0 40px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 25px;

      background: rgba(76,255,154,.12);
      border: 1px solid rgba(76,255,154,.24);
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .live {
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .live::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--green);
    }

    .panel {
      background: linear-gradient(
        160deg,
        rgba(18,49,35,.92),
        rgba(8,18,14,.92)
      );

      border: 1px solid var(--line);
      border-radius: 25px;
      padding: 18px;
      box-shadow: 0 22px 60px rgba(0,0,0,.35);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 10px;
    }

    .stat {
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 17px;
      padding: 14px;
    }

    .stat-title {
      font-size: 11px;
      color: var(--muted);
    }

    .stat-value {
      margin-top: 5px;
      font-size: 23px;
      font-weight: 900;
    }

    #pot {
      color: var(--gold);
    }

    .choose {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.09);

      background: #0b1510;
      color: white;

      outline: none;
      font-size: 15px;
    }

    select:focus,
    input:focus {
      border-color: rgba(76,255,154,.5);
    }

    .tip {
      margin-top: 7px;
      font-size: 11px;
      color: var(--muted);
    }

    .section-title {
      margin: 22px 3px 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 11px;
    }

    .player {
      min-height: 145px;
      padding: 17px;

      border-radius: 21px;
      border: 1px solid var(--line);

      background: linear-gradient(
        160deg,
        var(--panel2),
        var(--panel)
      );

      transition: .2s;
    }

    .player.me {
      border-color: rgba(76,255,154,.6);
      box-shadow:
        0 0 0 2px rgba(76,255,154,.08),
        0 15px 40px rgba(0,0,0,.25);
    }

    .player.folded {
      opacity: .45;
    }

    .player.out {
      opacity: .28;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .name {
      font-weight: 900;
      font-size: 17px;
    }

    .badges {
      display: flex;
      gap: 5px;
    }

    .badge {
      font-size: 10px;
      padding: 5px 7px;
      border-radius: 8px;
      font-weight: 900;
    }

    .dealer {
      background: var(--gold);
      color: #111;
    }

    .allin {
      background: var(--green);
      color: #07120c;
    }

    .fold {
      background: rgba(255,98,120,.18);
      color: #ff91a0;
    }

    .chips {
      margin-top: 17px;
      font-size: 27px;
      font-weight: 950;
    }

    .chips span {
      font-size: 11px;
      color: var(--muted);
    }

    .bet {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .bet b {
      color: var(--blue);
    }

    .actions {
      position: sticky;
      bottom: 10px;
      z-index: 20;

      margin-top: 17px;
      padding: 12px;

      border-radius: 22px;
      border: 1px solid var(--line);

      background: rgba(6,14,10,.9);
      backdrop-filter: blur(18px);

      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 8px;
    }

    button {
      min-height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.06);

      background: #14231b;
      color: white;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .green {
      background: linear-gradient(
        135deg,
        var(--green),
        var(--green2)
      );

      color: #05200f;
    }

    .red {
      background: rgba(255,98,120,.13);
      color: #ff91a0;
    }

    .gold {
      background: linear-gradient(
        135deg,
        #ffe489,
        #ffcb47
      );

      color: #171100;
    }

    .raise {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 8px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);

      padding: 35px;
      border: 1px dashed var(--line);
      border-radius: 20px;
    }

    .toast {
      position: fixed;
      z-index: 999;

      top: 17px;
      left: 50%;

      transform: translate(-50%,-20px);

      background: white;
      color: #07130c;

      padding: 11px 15px;
      border-radius: 12px;

      font-size: 13px;
      font-weight: 900;

      opacity: 0;
      pointer-events: none;

      transition: .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%,0);
    }

    @media(max-width: 760px) {

      .stats {
        grid-template-columns: repeat(2,1fr);
      }

      .players {
        grid-template-columns: repeat(2,1fr);
      }

      .buttons {
        grid-template-columns: repeat(2,1fr);
      }

    }

    @media(max-width: 470px) {

      .container {
        width: calc(100% - 16px);
      }

      .players {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 15px;
      }

      .chips {
        font-size: 25px;
      }

    }
  </style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="container">

  <header class="header">

    <div class="brand">

      <div class="logo">
        ♠
      </div>

      <div>
        <h1>215 德州撲克</h1>
        <div class="subtitle">
          班級籌碼計算器
        </div>
      </div>

    </div>

    <div class="live">
      即時同步
    </div>

  </header>


  <section class="panel">

    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          底池
        </div>

        <div class="stat-value" id="pot">
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          目前階段
        </div>

        <div class="stat-value" id="phase">
          翻牌前
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          目前最高下注
        </div>

        <div class="stat-value" id="currentBet">
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          小盲 / 大盲
        </div>

        <div class="stat-value" id="blinds">
          10 / 20
        </div>
      </div>

    </div>


    <div class="choose">

      <select id="playerSelect">

        <option value="">
          選擇你的名字
        </option>

      </select>

      <div class="tip">
        選過一次後，這台手機會自動記住你的名字。
      </div>

    </div>

  </section>



  <div class="section-title">

    <h2>
      目前玩家
    </h2>

    <span id="playerCount">
      0 人
    </span>

  </div>


  <section
    class="players"
    id="players">
  </section>



  <section class="actions">

    <div class="buttons">

      <button id="checkBtn">
        過牌
      </button>

      <button
        class="green"
        id="callBtn">
        跟注
      </button>

      <button
        class="red"
        id="foldBtn">
        棄牌
      </button>

      <button
        class="gold"
        id="allinBtn">
        梭哈
      </button>

    </div>


    <div class="raise">

      <input
        id="raiseAmount"
        type="number"
        min="1"
        inputmode="numeric"
        placeholder="輸入加注金額">

      <button id="raiseBtn">
        加注
      </button>

    </div>

  </section>

</div>



<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";


import {

  getFirestore,
  doc,
  collection,
  onSnapshot,
  runTransaction,
  setDoc,
  serverTimestamp

} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";



const firebaseConfig = {

  apiKey:
  "AIzaSyC1ypnHgPuhjoe6u7D-opVzQSZEgv9q34k",

  authDomain:
  "token-77aaf.firebaseapp.com",

  projectId:
  "token-77aaf",

  storageBucket:
  "token-77aaf.firebasestorage.app",

  messagingSenderId:
  "1055537384689",

  appId:
  "1:1055537384689:web:84544d089ab33f7e12ad50",

  measurementId:
  "G-BEE6LSR74B"

};



const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);



const ROOM =
"main";


const gameRef =
doc(
  db,
  "rooms",
  ROOM
);


const playersRef =
collection(
  db,
  "rooms",
  ROOM,
  "players"
);



let game = {

  pot: 0,

  currentBet: 0,

  smallBlind: 10,

  bigBlind: 20,

  phase: "翻牌前",

  hand: 1,

  dealerId: ""

};


let players = [];


let selectedId =
localStorage.getItem(
  "pokerPlayerId"
) || "";



const $ =
selector =>
document.querySelector(selector);



const formatNumber =
number =>
Number(number || 0)
.toLocaleString("zh-TW");



function showToast(message) {

  const toast =
  $("#toast");

  toast.textContent =
  message;

  toast.classList.add(
    "show"
  );

  setTimeout(() => {

    toast.classList.remove(
      "show"
    );

  }, 1600);

}



async function createGameIfNeeded() {

  await setDoc(

    gameRef,

    {

      pot: 0,

      currentBet: 0,

      smallBlind: 10,

      bigBlind: 20,

      phase:
      "翻牌前",

      hand: 1,

      dealerId: "",

      updatedAt:
      serverTimestamp()

    },

    {
      merge: true
    }

  );

}



createGameIfNeeded()
.catch(console.error);



onSnapshot(

  gameRef,

  snapshot => {

    if (
      snapshot.exists()
    ) {

      game = {

        ...game,

        ...snapshot.data()

      };

    }

    render();

  }

);



onSnapshot(

  playersRef,

  snapshot => {

    players =
    snapshot.docs
    .map(doc => ({

      id: doc.id,

      ...doc.data()

    }))

    .sort(
      (a,b) =>
      (a.seat ?? 999)
      -
      (b.seat ?? 999)
    );


    if (
      selectedId &&
      !players.some(
        player =>
        player.id === selectedId
      )
    ) {

      selectedId = "";

      localStorage.removeItem(
        "pokerPlayerId"
      );

    }


    render();

  }

);



function render() {

  $("#pot").textContent =
  formatNumber(game.pot);


  $("#phase").textContent =
  game.phase || "翻牌前";


  $("#currentBet").textContent =
  formatNumber(game.currentBet);


  $("#blinds").textContent =
  `${formatNumber(game.smallBlind)}
   /
   ${formatNumber(game.bigBlind)}`;


  $("#playerCount").textContent =
  `${players.length} 人`;



  const select =
  $("#playerSelect");


  select.innerHTML =

  `<option value="">
    選擇你的名字
  </option>`

  +

  players.map(

    player =>

    `<option value="${player.id}">
      ${escapeHtml(player.name)}
    </option>`

  ).join("");



  select.value =
  selectedId;



  const container =
  $("#players");


  if (
    players.length === 0
  ) {

    container.innerHTML =

    `<div class="empty">
      管理員還沒有新增玩家
    </div>`;

  }

  else {

    container.innerHTML =

    players.map(

      player => {

        const status =
        player.status || "active";


        let badges = "";


        if (
          player.id ===
          game.dealerId
        ) {

          badges +=

          `<span class="badge dealer">
            莊
          </span>`;

        }


        if (
          status === "allin"
        ) {

          badges +=

          `<span class="badge allin">
            梭哈
          </span>`;

        }


        if (
          status === "folded"
        ) {

          badges +=

          `<span class="badge fold">
            棄牌
          </span>`;

        }



        return `

        <div class="
          player
          ${player.id === selectedId ? "me" : ""}
          ${status}
        ">

          <div class="player-top">

            <div class="name">
              ${escapeHtml(player.name)}
            </div>

            <div class="badges">
              ${badges}
            </div>

          </div>


          <div class="chips">

            ${formatNumber(player.chips)}

            <span>
              籌碼
            </span>

          </div>


          <div class="bet">

            本輪下注：

            <b>
              ${formatNumber(player.bet)}
            </b>

          </div>

        </div>

        `;

      }

    ).join("");

  }


  updateButtons();

}



function updateButtons() {

  const me =
  players.find(
    player =>
    player.id === selectedId
  );


  const disabled =

  !me

  ||

  [
    "folded",
    "out",
    "allin"
  ].includes(
    me?.status
  );


  [

    "#checkBtn",
    "#callBtn",
    "#foldBtn",
    "#allinBtn",
    "#raiseBtn",
    "#raiseAmount"

  ].forEach(
    id =>
    $(id).disabled =
    disabled
  );



  if (!me) {

    $("#callBtn").textContent =
    "跟注";

    return;

  }



  const needCall =

  Math.max(

    0,

    Number(
      game.currentBet || 0
    )

    -

    Number(
      me.bet || 0
    )

  );



  $("#callBtn").textContent =

  needCall > 0

  ?

  `跟注 ${formatNumber(
    Math.min(
      needCall,
      me.chips || 0
    )
  )}`

  :

  "跟注 0";



  $("#checkBtn").disabled =

  disabled
  ||
  needCall > 0;

}



$("#playerSelect")
.addEventListener(

  "change",

  event => {

    selectedId =
    event.target.value;


    if (selectedId) {

      localStorage.setItem(
        "pokerPlayerId",
        selectedId
      );

    }

    else {

      localStorage.removeItem(
        "pokerPlayerId"
      );

    }


    render();

  }

);



$("#checkBtn")
.onclick =
() => pokerAction("check");


$("#callBtn")
.onclick =
() => pokerAction("call");


$("#foldBtn")
.onclick =
() => pokerAction("fold");


$("#allinBtn")
.onclick =
() => pokerAction("allin");


$("#raiseBtn")
.onclick =
() => pokerAction("raise");



async function pokerAction(type) {

  if (!selectedId) {

    showToast(
      "先選擇你的名字"
    );

    return;

  }



  const playerRef =
  doc(
    db,
    "rooms",
    ROOM,
    "players",
    selectedId
  );



  try {

    await runTransaction(

      db,

      async transaction => {

        const gameSnapshot =
        await transaction.get(
          gameRef
        );


        const playerSnapshot =
        await transaction.get(
          playerRef
        );


        if (
          !gameSnapshot.exists()
          ||
          !playerSnapshot.exists()
        ) {

          throw new Error(
            "牌局資料不存在"
          );

        }



        const currentGame =
        gameSnapshot.data();


        const player =
        playerSnapshot.data();



        const chips =
        Number(
          player.chips || 0
        );


        const bet =
        Number(
          player.bet || 0
        );


        const currentBet =
        Number(
          currentGame.currentBet || 0
        );


        const pot =
        Number(
          currentGame.pot || 0
        );



        if (
          [
            "folded",
            "out",
            "allin"
          ].includes(
            player.status
          )
        ) {

          throw new Error(
            "你現在不能操作"
          );

        }



        if (
          type === "fold"
        ) {

          transaction.update(

            playerRef,

            {

              status:
              "folded",

              updatedAt:
              serverTimestamp()

            }

          );

          return;

        }



        if (
          type === "check"
        ) {

          if (
            bet < currentBet
          ) {

            throw new Error(
              "目前不能過牌，要先跟注"
            );

          }

          return;

        }



        let cost = 0;

        let newCurrentBet =
        currentBet;

        let newStatus =
        player.status ||
        "active";



        if (
          type === "call"
        ) {

          cost =

          Math.min(

            chips,

            Math.max(
              0,
              currentBet - bet
            )

          );

        }



        if (
          type === "raise"
        ) {

          const raiseAmount =

          Math.floor(

            Number(
              $("#raiseAmount").value
              ||
              0
            )

          );


          if (
            raiseAmount <= 0
          ) {

            throw new Error(
              "請輸入正確的加注金額"
            );

          }



          const target =

          currentBet
          +
          raiseAmount;



          cost =
          target - bet;



          if (
            cost >= chips
          ) {

            cost =
            chips;

            newStatus =
            "allin";

          }



          newCurrentBet =

          Math.max(

            currentBet,

            bet + cost

          );

        }



        if (
          type === "allin"
        ) {

          if (
            chips <= 0
          ) {

            throw new Error(
              "你沒有籌碼了"
            );

          }


          cost =
          chips;


          newStatus =
          "allin";


          newCurrentBet =

          Math.max(

            currentBet,

            bet + chips

          );

        }



        const remaining =
        chips - cost;



        if (
          remaining === 0
        ) {

          newStatus =
          "allin";

        }



        transaction.update(

          playerRef,

          {

            chips:
            remaining,

            bet:
            bet + cost,

            status:
            newStatus,

            updatedAt:
            serverTimestamp()

          }

        );



        transaction.update(

          gameRef,

          {

            pot:
            pot + cost,

            currentBet:
            newCurrentBet,

            updatedAt:
            serverTimestamp()

          }

        );

      }

    );



    if (
      type === "raise"
    ) {

      $("#raiseAmount").value =
      "";

    }



    const messages = {

      check:
      "已過牌",

      call:
      "已跟注",

      fold:
      "已棄牌",

      allin:
      "梭哈！",

      raise:
      "已加注"

    };


    showToast(
      messages[type]
      ||
      "操作完成"
    );

  }

  catch(error) {

    console.error(error);

    showToast(
      error.message
      ||
      "操作失敗"
    );

  }

}



function escapeHtml(text) {

  return String(text)
  .replace(

    /[&<>"']/g,

    character => ({

      "&": "&amp;",

      "<": "&lt;",

      ">": "&gt;",

      '"': "&quot;",

      "'": "&#039;"

    })[character]

  );

}

</script>

</body>
</html>
