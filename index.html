}

function loadLoopRoster() {
  return db.collection('roster').get().then(function (q) {
    LOOP.roster = [];
    q.forEach(function (d) {
      LOOP.roster.push({
        id: d.id, name: d.data().name || d.id,
        chips: d.data().chips, blocked: !!d.data().blocked
      });
    });
  }).catch(function () {});
}

function normalizeState(d) {
  return {
    status: d.status, settings: d.settings, seats: d.seats || [], hand: d.hand,
    pots: d.pots || [], queue: d.queue || [], log: d.log || [],
    board: d.board || [], reveal: d.reveal || null, lastResults: d.lastResults || null,
    deck: [], hole: {}
  };
}

var SECRET = TABLE.collection('secret').doc('deck');
var HOLE = TABLE.collection('hole');

/* 每次牌桌快照都呼叫這個 */
function loopOnSnapshot(d) {
  if (!LOOP.own) LOOP.ST = normalizeState(d);   // 自己在當主機就不吃回音

  var at = d.leaseAt && d.leaseAt.toMillis ? d.leaseAt.toMillis() : 0;
  var stale = Date.now() - at > LEASE_MS;
  var mine = d.leaseUid === uid;

  if (mine) {
    setOwn(true);
  } else if (LOOP.isAdmin || stale) {
    claimLease();       // 後台隨時可搶；一般玩家等租約過期
    setOwn(false);
  } else {
    setOwn(false);
  }
}

function claimLease() {
  return TABLE.update({
    leaseUid: uid, leaseOwner: LOOP.me, leaseAt: FV.serverTimestamp()
  }).catch(function () {});
}

function setOwn(v) {
  if (LOOP.own === v) return;
  LOOP.own = v;
  LOOP.onOwn(v);

  if (v) {
    window.__isHost = true;
    keepAwake();
    // 接手主機時要把整副牌撈回來，不然這一手接不下去
    SECRET.get().then(function (d) {
      if (!d.exists || !LOOP.ST) return;
      var x = d.data();
      if (x.handNo === LOOP.ST.hand.no) {
        LOOP.ST.deck = x.deck || [];
        LOOP.ST.hole = x.hole || {};
      }
    }).catch(function () {});
    LOOP.renewTimer = setInterval(function () {
      TABLE.update({ leaseAt: FV.serverTimestamp() }).catch(function () {});
    }, 4000);
    LOOP.unsubActions = TABLE.collection('actions').orderBy('ts', 'asc')
      .onSnapshot(function (snap) {
        snap.docChanges().forEach(function (ch) {
          if (ch.type === 'removed') return;
          var doc = ch.doc;
          if (!doc.data().ts) return;
          if (LOOP.seen[doc.id]) return;
          LOOP.seen[doc.id] = true;
          enqueueAction(doc);
        });
      }, function () {});
  } else {
    window.__isHost = false;
    clearInterval(LOOP.renewTimer);
    clearAutoNext();
    if (LOOP.unsubActions) { try { LOOP.unsubActions(); } catch (e) {} }
    LOOP.unsubActions = null;
  }
}

function enqueueAction(doc) {
  var out = LOOP.queue.then(function () {
    var a = doc.data(), err = null;

    if (err === null) {
      try { applyAct(a); } catch (e) { err = e.message || String(e); }
    }

    if (err) {
      // 動作不合法：回報給本人，然後把它清掉
      return (a.id
        ? TABLE.collection('errors').doc(String(a.id))
            .set({ msg: err, at: FV.serverTimestamp() }).catch(function () {})
        : Promise.resolve()
      ).then(function () { return doc.ref.delete().catch(function () {}); });
    }

    // 一定要先確定狀態寫得進去，才可以刪掉這筆動作。
    // 順序反過來的話，租約被搶走時這筆動作會消失，輪次就卡死。
    return loopFlush().then(function () {
      if (a.type === 'join' || a.type === 'seat') loadLoopRoster();
      return doc.ref.delete().catch(function () {});
    }, function (e) {
      // 寫不進去代表租約已經不是我的了，退出主機重新同步，動作留給下一台處理
      delete LOOP.seen[doc.id];
      setOwn(false);
      return TABLE.get().then(function (d) {
        if (d.exists) LOOP.ST = normalizeState(d.data());
      }).catch(function () {});
    });
  }).catch(function () {});
  LOOP.queue = out;
  return out;
}

function rosterOf(id) {
  for (var i = 0; i < LOOP.roster.length; i++) if (LOOP.roster[i].id === id) return LOOP.roster[i];
  return null;
}

function noteLog(st, text) {
  st.log = (st.log || []).concat([{ t: Date.now(), text: text }]).slice(-25);
}

function seatWithChips(st, id, name, seat) {
  Engine.sit(st, id, name, seat);
  var r = rosterOf(id);
  if (r && r.chips != null) st.seats[seat].chips = r.chips;
  if (st.seats[seat].chips <= 0) st.seats[seat].state = 'sitout';
}

function applyAct(a) {
  var st = LOOP.ST, E = Engine;

  if (a.admin) {
    switch (a.type) {
      case 'start':
        E.startHand(st, a.seat >= 0 ? a.seat : undefined);
        return;
      case 'settings':
        Object.keys(a.settings || {}).forEach(function (k) { st.settings[k] = a.settings[k]; });
        if (a.settings && a.settings.seatCount && a.settings.seatCount !== st.seats.length) {
          var seats = st.seats.slice(0, a.settings.seatCount);
          while (seats.length < a.settings.seatCount) seats.push(null);
          st.seats = seats;
        }
        return;
      case 'addchips': E.addChips(st, a.seat, a.amount); return;
      case 'setchips':
        st.seats[a.seat].chips = Math.max(0, Math.round(a.amount));
        if (st.seats[a.seat].chips > 0 && st.seats[a.seat].state === 'sitout' && st.hand.phase === 'idle') {
          st.seats[a.seat].state = 'playing';
        }
        noteLog(st, st.seats[a.seat].name + ' 籌碼調整為 ' + st.seats[a.seat].chips);
        return;
      case 'move': E.move(st, a.seat, a.to); return;
      case 'kick': E.leave(st, a.seat); return;
      case 'seat': seatWithChips(st, a.pid, a.name, a.seat); return;
      case 'award': E.award(st, a.potIndex, a.winners); return;
      case 'abort':
        st.seats.forEach(function (p) {
          if (!p) return;
          p.chips += p.bet + p.committed;
          p.bet = 0; p.committed = 0; p.folded = false; p.allIn = false; p.acted = false;
        });
        st.hand.phase = 'idle';
        st.hand.turnSeat = -1;
        st.pots = [];
        st.pendingAward = null;
        noteLog(st, '— 這手作廢，籌碼退回 —');
        return;
      default: throw new Error('未知的後台動作');
    }
  }

  var seat = Engine.seatOf(st, a.id);

  switch (a.type) {
    case 'join':
      var r = rosterOf(a.id);
      if (r && r.blocked) throw new Error('你被移出這桌了，找主辦');
      var chips = (r && r.chips != null) ? r.chips : st.settings.startingChips;
      if (chips <= 0) chips = st.settings.startingChips;
      E.requestJoin(st, a.id, a.name || (r && r.name) || a.id, chips);
      return;

    case 'leave':
      E.requestLeave(st, a.id);
      return;

    case 'sitout':
      if (seat < 0) throw new Error('你不在桌上');
      E.setSitout(st, seat, !!a.value);
      return;

    case 'fold': case 'check': case 'call': case 'raise': case 'allin':
      if (seat < 0) throw new Error('你不在桌上');
      E.act(st, seat, a.type, a.amount);
      return;

    default: throw new Error('未知動作 ' + a.type);
  }
}

function loopFlush() {
  var st = JSON.parse(JSON.stringify(LOOP.ST));
  LOOP.onState(st);

  var jobs = [TABLE.set({
    status: st.status, settings: st.settings, seats: st.seats, hand: st.hand,
    pots: st.pots || [], queue: st.queue || [], log: st.log || [],
    board: st.board || [], reveal: st.reveal || null, lastResults: st.lastResults || null,
    leaseUid: uid, leaseOwner: LOOP.me, leaseAt: FV.serverTimestamp()
  }, { merge: true })];

  // 整副牌只放在這裡，規則鎖成只有持租約的裝置讀得到
  jobs.push(SECRET.set({
    deck: st.deck || [], hole: st.hole || {}, handNo: st.hand.no
  }).catch(function () {}));

  // 新的一手才發底牌，一人一份，只有本人讀得到
  if (st.hand.no !== LOOP.dealtHand && st.hand.phase !== 'idle') {
    LOOP.dealtHand = st.hand.no;
    st.seats.forEach(function (p, i) {
      if (!p) return;
      var cards = (st.hole && st.hole[i]) ? st.hole[i] : [];
      jobs.push(HOLE.doc(String(p.uid)).set({ cards: cards, handNo: st.hand.no })
        .catch(function () {}));
    });
  }

  // 一手打完，把籌碼和戰績寫回名單
  if (st.lastResults && st.lastResults.hand !== LOOP.statsHand) {
    LOOP.statsHand = st.lastResults.hand;
    st.lastResults.rows.forEach(function (row) {
      var r = rosterOf(row.id) || {};
      var patch = { chips: row.chips };
      if (row.chips > (r.peak || 0)) patch.peak = row.chips;
      if (row.won) patch.wins = (r.wins || 0) + 1;
      if (row.played) patch.hands = (r.hands || 0) + 1;
      jobs.push(db.collection('roster').doc(String(row.id)).update(patch).catch(function () {}));
    });
  }

  return Promise.all(jobs);
}

/* 送動作到佇列 */
function sendAct(type, extra, asAdmin) {
  var a = { type: type, ts: FV.serverTimestamp() };
  if (asAdmin) a.admin = true; else a.id = LOOP.me;
  if (extra) for (var k in extra) a[k] = extra[k];
  return TABLE.collection('actions').add(a);
}

/* ---------- 自動開下一手（由當下的主機負責） ---------- */
function clearAutoNext() {
  if (LOOP.autoTimer) { clearInterval(LOOP.autoTimer); LOOP.autoTimer = null; }
  LOOP.autoLeft = 0;
}

function readyPlayers(st) {
  var n = 0;
  st.seats.forEach(function (p) { if (p && p.state === 'playing' && p.chips > 0) n++; });
  return n;
}

function maybeAutoNext(onTick) {
  var st = LOOP.ST;
  if (!LOOP.own || !st) { clearAutoNext(); return; }
  var on = st.settings.autoNext !== false;
  if (!on || st.hand.phase !== 'idle' || st.pendingAward || readyPlayers(st) < 2) { clearAutoNext(); return; }
  if (LOOP.autoTimer) return;

  LOOP.autoLeft = st.settings.autoDelay || 6;
  if (onTick) onTick(LOOP.autoLeft);
  LOOP.autoTimer = setInterval(function () {
    LOOP.autoLeft--;
    if (LOOP.autoLeft > 0) { if (onTick) onTick(LOOP.autoLeft); return; }
    clearAutoNext();
    var s = LOOP.ST;
    if (LOOP.own && s && s.hand.phase === 'idle' && readyPlayers(s) >= 2 && s.settings.autoNext !== false) {
      LOOP.queue = LOOP.queue.then(function () {
        try { Engine.startHand(s); } catch (e) { return; }
        return loopFlush();
      }).catch(function () {});
    }
    if (onTick) onTick(0);
  }, 1000);
}


/* panel.js — 主辦功能，塞在前台的抽屜裡，要密碼才解得開。
   前端的鎖只防誤觸；真正擋人的是 Firestore 規則。 */

var ADM = {
  unlocked: false,
  firstRun: false,
  roster: [],
  awardPick: {},
  ready: false
};

var ADMIN_DOC = db.collection('config').doc('admin');
var ADMIN_PW = db.collection('config').doc('secret');

/* 開場先確認自己是不是主辦 */
function admBoot() {
  return ADMIN_DOC.get().then(function (s) {
    ADM.ready = true;
    if (!s.exists) { ADM.firstRun = true; return; }
    if (s.data().uid === uid) {
      ADM.unlocked = true;
      LOOP.isAdmin = true;
      admLoadRoster();
    }
  }).catch(function () { ADM.ready = true; });
}

function admLoadRoster() {
  return loadLoopRoster().then(function () {
    ADM.roster = LOOP.roster.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    if (TAB === 'settings') renderSettings();
  });
}

function admUnlock(pw, pw2) {
  if (!pw) return Promise.reject(new Error('要打密碼'));
  var claim = ADMIN_DOC.collection('claims').doc(uid);
  var step;
  if (ADM.firstRun) {
    if (pw.length < 4) return Promise.reject(new Error('至少 4 碼'));
    if (pw !== pw2) return Promise.reject(new Error('兩次打的不一樣'));
    step = ADMIN_PW.set({ pw: pw })
      .then(function () { return claim.set({ pw: pw, at: FV.serverTimestamp() }); })
      .then(function () { return ADMIN_DOC.set({ uid: uid, at: FV.serverTimestamp() }); });
  } else {
    step = claim.set({ pw: pw, at: FV.serverTimestamp() })
      .catch(function () {
        // 密碼文件可能根本不存在（舊版留下的殘骸），補建一次再試
        return ADMIN_PW.set({ pw: pw })
          .then(function () { return claim.set({ pw: pw, at: FV.serverTimestamp() }); })
          .catch(function () { throw new Error('密碼不對'); });
      })
      .then(function () { return ADMIN_DOC.update({ uid: uid, at: FV.serverTimestamp() }); })
      .catch(function (e) {
        if (e && e.message === '密碼不對') throw e;
        throw new Error('換不了主辦身分：' + (e.code || e.message));
      });
  }
  return step.then(function () {
    ADM.unlocked = true;
    ADM.firstRun = false;
    LOOP.isAdmin = true;
    return admEnsureTable();
  }).then(admLoadRoster);
}

function admEnsureTable() {
  return TABLE.get().then(function (s) {
    if (s.exists) return;
    var st = Engine.newRoom(Engine.defaultSettings());
    st.settings.startingChips = 1500;
    return TABLE.set({
      status: st.status, settings: st.settings, seats: st.seats, hand: st.hand,
      pots: [], pendingAward: null, log: [],
      leaseUid: uid, leaseOwner: 'admin', leaseAt: FV.serverTimestamp()
    });
  });
}

function admOp(type, extra) {
  return sendAct(type, extra, true).catch(function (e) {
    toast('送不出去：' + (e.code || e.message), 'bad');
    throw e;
  });
}

/* ---------- 綁事件 ---------- */
function admBind() {
  if (!ADM.ready) return;

  if ($('admUnlockBtn')) {
    $('admUnlockBtn').onclick = function () {
      var b = this; b.disabled = true;
      admUnlock($('admPw').value, $('admPw2') ? $('admPw2').value : null)
        .then(function () { toast('解開了'); renderSettings(); })
        .catch(function (e) { b.disabled = false; toast(e.message || '解不開', 'bad'); });
    };
  }
  if (!ADM.unlocked) return;

  if ($('admLock')) $('admLock').onclick = function () {
    ADM.unlocked = false; LOOP.isAdmin = false; renderSettings();
  };

  if ($('admStart')) $('admStart').onclick = function () {
    clearAutoNext();
    admOp('start', { seat: -1 }).catch(function () {});
  };

  if ($('admAbort')) $('admAbort').onclick = function () {
    if (confirm('作廢這一手？所有人下的注原數退回。')) admOp('abort').catch(function () {});
  };

  var root = $('setPane');

  Array.prototype.slice.call(root.querySelectorAll('[data-add]')).forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-add');
      var v = prompt('補多少給 ' + ST.seats[i].name + '？', ST.settings.startingChips);
      if (v) admOp('addchips', { seat: i, amount: Math.round(+v) }).catch(function () {});
    };
  });

  Array.prototype.slice.call(root.querySelectorAll('[data-set]')).forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-set');
      var v = prompt('把 ' + ST.seats[i].name + ' 的籌碼直接改成？', ST.seats[i].chips);
      if (v !== null) admOp('setchips', { seat: i, amount: Math.max(0, Math.round(+v)) }).catch(function () {});
    };
  });

  Array.prototype.slice.call(root.querySelectorAll('[data-pw]')).forEach(function (b) {
    b.onclick = function () {
      var p = ST.seats[+b.getAttribute('data-pw')];
      var ref = db.collection('roster').doc(String(p.uid)).collection('private').doc('pw');
      ref.get().then(function (s) {
        var cur = s.exists ? s.data().pw : null;
        var v = prompt(cur === null
          ? p.name + ' 還沒設過密碼。要現在指定一組嗎？'
          : p.name + ' 目前密碼：' + cur + '\n\n要改就打新的，留空取消。', cur || '');
        if (!v) return;
        return ref.set({ pw: v })
          .then(function () { return db.collection('roster').doc(String(p.uid)).collection('claims').get(); })
          .then(function (q) {
            var jobs = [];
            q.forEach(function (d) { jobs.push(d.ref.delete().catch(function () {})); });
            return Promise.all(jobs);
          })
          .then(function () { toast(p.name + ' 密碼改成 ' + v + '，他要重新登入'); });
      }).catch(function () { toast('讀不到密碼', 'bad'); });
    };
  });

  Array.prototype.slice.call(root.querySelectorAll('[data-del]')).forEach(function (b) {
    b.onclick = function () {
      var i = +b.getAttribute('data-del'), p = ST.seats[i];
      if (!confirm('把 ' + p.name + '（' + p.uid + '）移出牌桌？\n\n籌碼會記著，之後可以原數拉回。')) return;
      db.collection('roster').doc(String(p.uid))
        .update({ chips: p.chips, blocked: true }).catch(function () {})
        .then(function () { return admOp('kick', { seat: i }); })
        .then(admLoadRoster).catch(function () {});
    };
  });

  Array.prototype.slice.call(root.querySelectorAll('[data-back]')).forEach(function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-back');
      var r = ADM.roster.filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      var free = [];
      ST.seats.forEach(function (p, i) { if (!p) free.push(i + 1); });
      if (!free.length) return toast('沒有空位了', 'bad');
      var v = prompt(r.name + ' 坐幾號位？空位：' + free.join('、'), free[0]);
      if (!v) return;
      var seat = Math.round(+v) - 1;
      if (free.indexOf(seat + 1) < 0) return toast('那個位子不能坐', 'bad');
      admOp('seat', { pid: id, name: r.name, seat: seat })
        .then(function () {
          return db.collection('roster').doc(id)
            .update({ chips: FV.delete(), blocked: false }).catch(function () {});
        })
        .then(admLoadRoster)
        .then(function () { toast(r.name + ' 回到 ' + (seat + 1) + ' 號位'); })
        .catch(function () {});
    };
  });
}

/* settings.js — 設定分頁 */

function renderSettings() {
  var h = '';

  if (!ADM.ready) { paint('setPane', '<div class="empty">載入中…</div>'); return; }

  if (!ADM.unlocked) {
    h += '<div class="grp"><div class="grp-h">主辦</div><div class="grp-b">' +
      '<div class="ios-row"><span>' + (ADM.firstRun ? '設定主辦密碼' : '主辦密碼') + '</span>' +
      '<input id="admPw" type="password" placeholder="' + (ADM.firstRun ? '至少 4 碼' : '輸入密碼') + '"></div>' +
      (ADM.firstRun ? '<div class="ios-row"><span>再打一次</span><input id="admPw2" type="password"></div>' : '') +
      '</div></div>';
    h += '<button class="btn" id="admUnlockBtn">' + (ADM.firstRun ? '啟用' : '解鎖') + '</button>';
    h += '<p class="note">只有主辦需要進來，一般玩家不用管這頁。</p>';
    if (!paint('setPane', h)) return;
    admBind();
    return;
  }

  if (!ST) { paint('setPane', '<div class="empty">牌桌還沒載入</div>'); return; }
  var st = ST, S = st.settings;

  /* 牌局 */
  h += '<div class="grp"><div class="grp-h">牌局</div><div class="grp-b">';
  h += '<div class="ios-row"><span>狀態</span><b>' +
       (st.hand.phase === 'idle' ? '等待開牌' : Engine.phaseName(st.hand.phase)) + '</b></div>';
  h += '<div class="ios-row"><span>主機</span><b>' + (LOOP.own ? '這台裝置' : '別人的裝置') + '</b></div>';
  h += '<div class="ios-row"><span>候補</span><b>' + ((st.queue || []).length) + ' 人</b></div>';
  h += '</div></div>';
  h += st.hand.phase === 'idle'
    ? '<button class="btn" id="admStart">' +
      (LOOP.autoLeft > 0 ? '立刻開始（' + LOOP.autoLeft + '）' : '開始下一手') + '</button>'
    : '<button class="btn danger" id="admAbort">作廢這手，籌碼退回</button>';

  /* 名單 */
  h += '<div class="grp"><div class="grp-h">名單</div><div class="grp-b">';
  var seated = [];
  st.seats.forEach(function (p, i) {
    if (!p) return;
    seated.push(String(p.uid));
    h += '<div class="ios-row tall"><span class="pl">' +
      '<b>' + esc(p.name) + '</b><em>#' + esc(p.uid) + '　' + (i + 1) + ' 號位</em></span>' +
      '<span class="money">' + fmt(p.chips) + '</span>' +
      '<span class="acts"><button data-add="' + i + '">補</button>' +
      '<button data-set="' + i + '">改</button>' +
      '<button data-pw="' + i + '">碼</button>' +
      '<button data-del="' + i + '">移</button></span></div>';
  });
  ADM.roster.filter(function (r) { return seated.indexOf(r.id) < 0; }).forEach(function (r) {
    h += '<div class="ios-row tall off"><span class="pl">' +
      '<b>' + esc(r.name) + '</b><em>#' + esc(r.id) + '　不在桌上</em></span>' +
      '<span class="money">' + fmt(r.chips) + '</span>' +
      '<span class="acts"><button data-rpw="' + esc(r.id) + '">碼</button></span></div>';
  });
  h += '</div></div>';

  /* 設定 */
  h += '<div class="grp"><div class="grp-h">規則</div><div class="grp-b">';
  h += row('小盲', '<input id="admSb" type="number" value="' + S.sb + '">');
  h += row('大盲', '<input id="admBb" type="number" value="' + S.bb + '">');
  h += row('起始／補碼', '<input id="admStack" type="number" value="' + S.startingChips + '">');
  h += row('座位數', sel('admSeats', [2, 4, 6, 8, 9, 10], st.seats.length));
  h += row('思考秒數', '<input id="admTurn" type="number" value="' + (S.turnSec || 45) + '">');
  h += row('一手打完', '<select id="admAuto"><option value="1"' +
       (S.autoNext !== false ? ' selected' : '') + '>自動開下一手</option><option value="0"' +
       (S.autoNext === false ? ' selected' : '') + '>等我按</option></select>');
  h += row('間隔秒數', '<input id="admDelay" type="number" value="' + (S.autoDelay || 6) + '">');
  h += '</div></div>';
  h += '<button class="btn ghost" id="admSave">儲存規則</button>';

  /* 診斷 */
  var H = st.hand;
  h += '<div class="grp"><div class="grp-h">診斷</div><div class="grp-b diag">';
  h += '<div>注額 ' + fmt(H.currentBet) + '　最小加注 ' + fmt(H.minRaise) +
       '　小盲 ' + (H.sbSeat + 1) + '　大盲 ' + (H.bbSeat + 1) + '</div>';
  st.seats.forEach(function (p, i) {
    if (!p) return;
    var f = [];
    if (p.folded) f.push('蓋');
    if (p.allIn) f.push('全下');
    if (p.leaveAfter) f.push('待離');
    if (p.state !== 'playing') f.push(p.state === 'sitout' ? '暫離' : '等下手');
    f.push(p.acted ? '已動作' : '未動作');
    h += '<div' + (H.turnSeat === i ? ' class="hot"' : '') + '>' + (i + 1) + ' ' + esc(p.name) +
         '　本街 ' + fmt(p.bet) + '　本手 ' + fmt(p.committed) + '　' + f.join('/') + '</div>';
  });
  h += '</div></div>';

  h += '<div class="grp"><div class="grp-h">紀錄</div><div class="grp-b logbox">' +
       (st.log || []).slice().reverse().map(function (l) { return esc(l.text); }).join('<br>') +
       '</div></div>';

  h += '<button class="btn ghost" id="admLock">鎖回去</button>';
  h += '<button class="btn danger" style="margin-top:10px" id="doLogout">登出</button>';

  if (!paint('setPane', h)) return;
  admBind();
  bindSettingsExtra();
}

function row(label, input) {
  return '<div class="ios-row"><span>' + label + '</span>' + input + '</div>';
}
function sel(id, opts, cur) {
  return '<select id="' + id + '">' + opts.map(function (n) {
    return '<option value="' + n + '"' + (n === cur ? ' selected' : '') + '>' + n + '</option>';
  }).join('') + '</select>';
}

function bindSettingsExtra() {
  if ($('doLogout')) $('doLogout').onclick = function () {
    auth.signOut().then(function () { location.reload(); });
  };
  if ($('admTurn')) {
    var save = $('admSave');
    if (save) {
      save.onclick = function () {
        var sb = Math.max(1, +$('admSb').value);
        var bb = Math.max(sb + 1, +$('admBb').value);
        var seatCount = +$('admSeats').value;
        for (var i = seatCount; i < ST.seats.length; i++) {
          if (ST.seats[i]) return toast('第 ' + (i + 1) + ' 號位還有人，先移除', 'bad');
        }
        admOp('settings', { settings: {
          sb: sb, bb: bb,
          startingChips: Math.max(bb, +$('admStack').value),
          turnSec: Math.max(10, Math.min(180, +$('admTurn').value || 45)),
          autoNext: $('admAuto').value === '1',
          autoDelay: Math.max(2, Math.min(60, +$('admDelay').value || 6)),
          seatCount: seatCount
        } }).then(function () { toast('已儲存，下一手生效'); }).catch(function () {});
      };
    }
  }
  Array.prototype.slice.call($('setPane').querySelectorAll('[data-rpw]')).forEach(function (b) {
    b.onclick = function () { editPw(b.getAttribute('data-rpw')); };
  });
}

function editPw(id) {
  var ref = db.collection('roster').doc(String(id)).collection('private').doc('pw');
  ref.get().then(function (s) {
    var cur = s.exists ? s.data().pw : null;
    var v = prompt(cur === null ? '這個編號還沒設過密碼，要指定一組嗎？'
      : '目前密碼：' + cur + '\n\n要改就打新的，留空取消。', cur || '');
    if (!v) return;
    return ref.set({ pw: v })
      .then(function () { return db.collection('roster').doc(String(id)).collection('claims').get(); })
      .then(function (q) {
        var jobs = [];
        q.forEach(function (d) { jobs.push(d.ref.delete().catch(function () {})); });
        return Promise.all(jobs);
      })
      .then(function () { toast('密碼改成 ' + v + '，他要重新登入'); });
  }).catch(function () { toast('讀不到密碼', 'bad'); });
}


/* app.js — 登入、三個分頁、牌桌、設定 */

var myId = null, myName = '', isNew = false;
var ST = null, mySeat = -1, myHole = [], myHoleHand = -1;
var ROSTER = [], TAB = 'home', raiseOpen = false, unsubs = [];
var _paint = {};

function paint(id, html) {
  if (_paint[id] === html) return false;
  _paint[id] = html;
  var el = $(id);
  if (!el) return false;
  el.innerHTML = html;
  return true;
}

/* ================= 登入 ================= */
$('pid').addEventListener('input', function () {
  var v = this.value.replace(/\D/g, '').slice(0, 2);
  this.value = v;
  if (v.length === 2) lookup(v); else setMode(null);
});

function setMode(reg, name) {
  isNew = reg === true;
  $('nameWrap').style.display = reg === true ? '' : 'none';
  $('pwLabel').textContent = reg === true ? '設一組密碼' : '密碼';
  $('gateHint').textContent =
    reg === null ? '打一組沒人用過的兩位數編號就能註冊。'
    : reg ? '這個編號還沒人用，填完就是你的。'
    : '這個編號是「' + name + '」，打你設過的密碼。';
  $('loginBtn').textContent = reg === true ? '註冊' : '進入';
}

function lookup(id) {
  db.collection('roster').doc(id).get().then(function (s) {
    if (s.exists) setMode(false, s.data().name || id);
    else setMode(true);
  }).catch(function () { setMode(null); });
}

$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

$('loginBtn').addEventListener('click', function () {
  var id = $('pid').value.trim(), pw = $('pw').value, nm = $('pname').value.trim();
  if (!/^\d{2}$/.test(id)) return toast('編號是兩位數字', 'bad');
  if (!pw) return toast('要打密碼', 'bad');
  if (isNew && !nm) return toast('要填名字', 'bad');

  var btn = this; btn.disabled = true;
  var rRef = db.collection('roster').doc(id);
  var claim = rRef.collection('claims').doc(uid);

  var step = isNew
    ? rRef.set({ name: nm, chips: 1500, peak: 1500, wins: 0, hands: 0 })
        .then(function () { return rRef.collection('private').doc('pw').set({ pw: pw }); })
        .then(function () { return claim.set({ pw: pw, at: FV.serverTimestamp() }); })
        .then(function () { myName = nm; })
    : rRef.get().then(function (s) {
        if (!s.exists) throw { code: 'gone' };
        myName = s.data().name || id;
        return claim.set({ pw: pw, at: FV.serverTimestamp() })
          .catch(function () { throw { code: 'bad' }; });
      });

  step.then(function () {
    myId = id;
    LS.set('lastId', id);
    boot();
  }).catch(function (e) {
    btn.disabled = false;
    toast(e && e.code === 'bad' ? '密碼不對'
        : e && e.code === 'gone' ? '這個編號不見了'
        : '進不去：' + ((e && (e.code || e.message)) || '不明'), 'bad');
  });
});

$('pid').value = LS.get('lastId', '');

/* ================= 啟動 ================= */
function boot() {
  $('gate').style.display = 'none';
  $('app').style.display = '';
  $('topWho').textContent = myName + '　' + myId;
  $('topBuild').textContent = BUILD;

  loopInit(myId, false, function () { ST = LOOP.ST; render(); }, function () { render(); });
  admBoot();

  unsubs.push(db.collection('roster').onSnapshot(function (q) {
    ROSTER = [];
    q.forEach(function (d) {
      var x = d.data();
      ROSTER.push({
        id: d.id, name: x.name || d.id,
        chips: x.chips || 0, peak: x.peak || 0,
        wins: x.wins || 0, hands: x.hands || 0
      });
    });
    LOOP.roster = ROSTER;
    render();
  }, function () {}));

  unsubs.push(TABLE.collection('hole').doc(myId).onSnapshot(function (d) {
    myHole = d.exists ? (d.data().cards || []) : [];
    myHoleHand = d.exists ? d.data().handNo : -1;
    render();
  }, function () {}));

  unsubs.push(TABLE.collection('errors').doc(myId).onSnapshot(function (d) {
    if (d.exists && d.data().msg) { toast(d.data().msg, 'bad'); d.ref.delete().catch(function () {}); }
  }, function () {}));

  unsubs.push(TABLE.onSnapshot(function (snap) {
    if (!snap.exists) { makeTable(); return; }
    loopOnSnapshot(snap.data());
    ST = LOOP.ST;
    render();
    maybeAutoNext(function () { renderTable(); });
  }, function (e) { toast('連線問題：' + e.code, 'bad'); }));

  setInterval(function () { if (TAB === 'table') renderTable(); }, 1000);
}

var _making = false;
function makeTable() {
  if (_making) return;
  _making = true;
  var st = Engine.newRoom(Engine.defaultSettings());
  st.settings.startingChips = 1500;
  TABLE.set({
    status: st.status, settings: st.settings, seats: st.seats, hand: st.hand,
    pots: [], queue: [], board: [], reveal: null, log: [],
    leaseUid: uid, leaseOwner: myId, leaseAt: FV.serverTimestamp()
  }).catch(function (e) { toast('開不了牌桌：' + e.code, 'bad'); })
    .then(function () { _making = false; });
}

function send(type, extra) {
  return sendAct(type, extra, false).catch(function (e) {
    toast('送不出去：' + e.code, 'bad');
  });
}

/* ================= 分頁 ================= */
Array.prototype.slice.call(document.querySelectorAll('.tabs button')).forEach(function (b) {
  b.addEventListener('click', function () {
    TAB = b.getAttribute('data-tab');
    Array.prototype.slice.call(document.querySelectorAll('.tabs button')).forEach(function (x) {
      x.classList.toggle('on', x === b);
    });
    ['home', 'table', 'set'].forEach(function (k) {
      $(k + 'Pane').style.display = (k === TAB || (k === 'set' && TAB === 'settings')) ? '' : 'none';
    });
    $('tablePane').style.display = TAB === 'table' ? '' : 'none';
    render();
  });
});

function render() {
  // 座位號每次重繪都要重算，不然離桌或被搬位之後會指到空位
  mySeat = ST ? Engine.seatOf(ST, myId) : -1;
  if (TAB === 'home') renderHome();
  else if (TAB === 'table') renderTable();
  else renderSettings();
}

/* ================= 主畫面 ================= */
function me() {
  for (var i = 0; i < ROSTER.length; i++) if (ROSTER[i].id === myId) return ROSTER[i];
  return { id: myId, name: myName, chips: 0, peak: 0, wins: 0, hands: 0 };
}

function liveChips(id) {
  if (ST) {
    for (var i = 0; i < ST.seats.length; i++) {
      if (ST.seats[i] && ST.seats[i].uid === id) return ST.seats[i].chips;
    }
  }
  for (var k = 0; k < ROSTER.length; k++) if (ROSTER[k].id === id) return ROSTER[k].chips;
  return 0;
}

function board(title, sub, rows, unit) {
  var h = '<div class="lb"><div class="lb-h">' + title + '<em>' + sub + '</em></div>';
  if (!rows.length) h += '<div class="lb-empty">還沒有資料</div>';
  rows.slice(0, 5).forEach(function (r, i) {
    h += '<div class="lb-row' + (r.id === myId ? ' me' : '') + '">' +
      '<span class="rk r' + (i + 1) + '">' + (i + 1) + '</span>' +
      '<span class="nm">' + esc(r.name) + '</span>' +
      '<span class="vl">' + fmt(r.v) + (unit || '') + '</span></div>';
  });
  return h + '</div>';
}

function renderHome() {
  var m = me(), cur = liveChips(myId);
  var h = '<div class="hero">' +
    '<div class="hero-name">' + esc(m.name) + '<em>#' + m.id + '</em></div>' +
    '<div class="hero-chips">' + fmt(cur) + '</div>' +
    '<div class="hero-sub">目前持有</div>' +
    '<div class="hero-grid">' +
      '<div><b>' + fmt(m.peak) + '</b><span>歷史最高</span></div>' +
      '<div><b>' + fmt(m.wins) + '</b><span>贏過幾局</span></div>' +
      '<div><b>' + fmt(m.hands) + '</b><span>打過幾手</span></div>' +
    '</div></div>';

  var byPeak = ROSTER.map(function (r) { return { id: r.id, name: r.name, v: r.peak }; })
    .sort(function (a, b) { return b.v - a.v; });
  var byNow = ROSTER.map(function (r) { return { id: r.id, name: r.name, v: liveChips(r.id) }; })
    .sort(function (a, b) { return b.v - a.v; });
  var byWin = ROSTER.map(function (r) { return { id: r.id, name: r.name, v: r.wins }; })
    .sort(function (a, b) { return b.v - a.v; });

  h += board('歷史最高', '這輩子最多拿到多少', byPeak);
  h += board('目前持有', '現在手上的籌碼', byNow);
  h += board('勝場', '贏過幾局牌', byWin, ' 局');

  paint('homePane', h);
}

/* ================= 牌桌 ================= */
function renderTable() {
  if (!ST) { paint('tableWrap', '<div class="empty">牌桌載入中…</div>'); return; }
  renderSeats();
  renderCenter();
  renderBar();
}

function renderCenter() {
  var total = Engine.potTotal(ST);
  setPot(total);
  renderBoard();
  var ph = ST.hand.phase === 'idle' ? '等待開牌' : Engine.phaseName(ST.hand.phase);
  paint('phase', ph);
  paint('sidepots', (ST.pots && ST.pots.length > 1)
    ? ST.pots.map(function (p, i) { return (i === 0 ? '主池' : '邊池' + i) + ' ' + fmt(p.amount); }).join('　')
    : '');
}

var _shownBoard = 0;
function cardHTML(c, extra) {
  if (c === null || c === undefined) return '<div class="c"></div>';
  return '<div class="c up' + (Cards.isRed(c) ? ' red' : '') + '"' + (extra || '') + '>' +
         '<span>' + Cards.text(c) + '</span></div>';
}

function renderBoard() {
  var el = $('board'), b = ST.board || [];
  if (_shownBoard === b.length && el.childElementCount === 5) return;
  var h = '';
  for (var i = 0; i < 5; i++) {
    h += i < b.length
      ? cardHTML(b[i], i >= _shownBoard ? ' style="animation-delay:' + ((i - _shownBoard) * 110) + 'ms"' : '')
      : '<div class="c"></div>';
  }
  _shownBoard = b.length;
  el.innerHTML = h;
}

function seatsKey() {
  return JSON.stringify([ST.seats, ST.hand.turnSeat, ST.hand.sbSeat, ST.hand.bbSeat,
    ST.hand.phase, ST.reveal, mySeat, $('felt').clientWidth, $('felt').clientHeight]);
}

function renderSeats(force) {
  var key = seatsKey();
  if (!force && _paint.__seats === key) return;
  _paint.__seats = key;

  var felt = $('felt');
  Array.prototype.slice.call(felt.querySelectorAll('.seat')).forEach(function (n) { n.remove(); });

  var n = ST.seats.length;
  var W = felt.clientWidth || 320, H = felt.clientHeight || 380;
  var perSide = Math.max(3, Math.ceil(n / 2));
  var w = Math.max(50, Math.min(92, (W - 18) / (perSide * 1.02)));
  var cardH = w * 0.68;
  var rx = ((W / 2) - (w / 2) - 2) / (W / 2) * 50;
  var ry = ((H / 2) - (cardH / 2) - 2) / (H / 2) * 50;
  var base = mySeat >= 0 ? mySeat : 0;

  for (var i = 0; i < n; i++) {
    var d = ((i - base) % n + n) % n;
    var th = (90 + d * 360 / n) * Math.PI / 180;
    var el = seatNode(i);
    el.style.left = (50 + rx * Math.cos(th)) + '%';
    el.style.top = (50 + ry * Math.sin(th)) + '%';
    el.style.width = Math.round(w) + 'px';
    felt.appendChild(el);
  }
}

function seatNode(i) {
  var p = ST.seats[i];
  var el = document.createElement('div');
  el.className = 'seat' + (p ? '' : ' empty') +
    (p && p.folded ? ' folded' : '') +
    (ST.hand.turnSeat === i ? ' turn' : '') +
    (i === mySeat ? ' me' : '');

  var h = '<div class="card">';
  if (!p) h += '<div class="nm dim">空位</div><div class="st">' + (i + 1) + '</div>';
  else {
    h += '<div class="nm">' + esc(p.name) + '</div><div class="ch">' + fmt(p.chips) + '</div>';
    if (p.allIn) h += '<div class="allin">ALL IN</div>';
    else if (p.leaveAfter) h += '<div class="st">這手後離開</div>';
    else if (p.chips <= 0 && p.state === 'sitout') h += '<div class="allin">出局</div>';
    else if (p.state === 'waiting') h += '<div class="st">下一手</div>';
    else if (p.folded) h += '<div class="st">已蓋牌</div>';
  }
  h += '</div>';

  var rv = ST.reveal && ST.reveal[i];
  if (rv) {
    h += '<div class="mini">' + rv.hole.map(function (c) { return cardHTML(c); }).join('') + '</div>';
    h += '<div class="hand-name">' + esc(rv.name) + '</div>';
  }
  if (p && p.bet > 0) h += '<div class="bet">' + fmt(p.bet) + '</div>';
  var tag = Engine.positionLabel(ST, i);
  if (tag) h += '<div class="tag">' + tag + '</div>';
  el.innerHTML = h;
  return el;
}

/* ---------- 下方操作區 ---------- */
function renderBar() {
  var bar = $('bar');
  var qp = Engine.queuePos(ST, myId);

  // 我的牌
  var live = myHole.length === 2 && myHoleHand === ST.hand.no && ST.hand.phase !== 'idle';
  paint('myCards', live
    ? '<span class="lbl">你的牌</span>' + myHole.map(function (c) { return cardHTML(c); }).join('')
    : '');
  $('myCards').style.display = live ? '' : 'none';

  if (mySeat < 0) {
    raiseOpen = false;
    $('raiseBox').classList.remove('on');
    bar.innerHTML = qp
      ? '<div class="waiting">候補中 · 第 ' + qp + ' 位</div>' +
        '<button class="btn ghost" data-a="leave">取消候補</button>'
      : '<button class="btn" data-a="join">加入牌桌</button>';
    bindBar();
    return;
  }

  var p = ST.seats[mySeat];
  if (!p) { mySeat = -1; renderBar(); return; }
  var turn = ST.hand.turnSeat === mySeat;

  if (!turn) {
    raiseOpen = false;
    $('raiseBox').classList.remove('on');
    var msg;
    if (ST.hand.phase === 'idle') {
      msg = LOOP.autoLeft > 0 ? LOOP.autoLeft + ' 秒後開下一手' : '等下一手開始';
    } else {
      var t = ST.hand.turnSeat >= 0 && ST.seats[ST.hand.turnSeat]
        ? ST.seats[ST.hand.turnSeat].name : '—';
      var left = turnLeft();
      msg = '等 ' + esc(t) + ' 動作' + (left >= 0 ? '（' + left + '）' : '');
    }
    if (p.leaveAfter) msg = '這手結束後就會離開';
    else if (p.chips <= 0 && ST.hand.phase === 'idle') msg = '你出局了，找主辦補碼';
    bar.innerHTML = '<div class="waiting">' + msg + '</div>' +
      (ST.hand.phase === 'idle' && !p.leaveAfter
        ? '<button class="btn ghost" data-a="leave">離開牌桌</button>'
        : (!p.leaveAfter ? '<button class="btn ghost" data-a="leave">這手結束後離開</button>' : ''));
    bindBar();
    return;
  }

  var L = Engine.legalMoves(ST, mySeat);
  var left = turnLeft();
  var h = '<div class="turn-hint">輪到你' + (left >= 0 ? '　<b>' + left + '</b> 秒' : '') + '</div>';
  h += '<div class="act-row"><button class="btn danger" data-a="fold">蓋牌</button>';
  h += L.check ? '<button class="btn ghost" data-a="check">過牌</button>'
               : '<button class="btn ghost" data-a="call">跟 ' + fmt(L.call) + '</button>';
  if (L.maxRaise > 0) {
    h += '<button class="btn" data-a="open">' + (ST.hand.currentBet === 0 ? '下注' : '加注') + '</button>';
  }
  h += '</div>';
  if (!p.leaveAfter) h += '<button class="leave-link" data-a="leave">這手結束後離開</button>';
  bar.innerHTML = h;
  bindBar();
  if (raiseOpen) setupRaise(L); else $('raiseBox').classList.remove('on');
}

function bindBar() {
  Array.prototype.slice.call($('bar').querySelectorAll('[data-a]')).forEach(function (b) {
    b.onclick = function () {
      var a = b.getAttribute('data-a');
      if (a === 'open') {
        raiseOpen = true;
        setupRaise(Engine.legalMoves(ST, mySeat));
        return;
      }
      raiseOpen = false;
      if (a === 'join') send('join', { name: myName });
      else if (a === 'leave') send('leave');
      else send(a);
    };
  });
}

function setupRaise(L) {
  var box = $('raiseBox'), val = $('raiseVal'), sl = $('raiseSlider');
  box.classList.add('on');
  sl.min = L.minRaise; sl.max = L.maxRaise; sl.step = 1;
  if (!val.value || +val.value < L.minRaise || +val.value > L.maxRaise) val.value = L.minRaise;
  sl.value = val.value;
  sl.oninput = function () { val.value = sl.value; };
  val.oninput = function () { sl.value = val.value; };

  Array.prototype.slice.call(box.querySelectorAll('[data-q]')).forEach(function (b) {
    b.onclick = function () {
      var pot = Engine.potTotal(ST), q = b.getAttribute('data-q'), v;
      if (q === 'min') v = L.minRaise;
      else if (q === 'half') v = ST.hand.currentBet + Math.round(pot / 2);
      else if (q === 'pot') v = ST.hand.currentBet + pot;
      else v = L.maxRaise;
      val.value = sl.value = Math.max(L.minRaise, Math.min(L.maxRaise, Math.round(v)));
    };
  });
  $('raiseGo').onclick = function () {
    var v = Math.round(+val.value);
    raiseOpen = false;
    box.classList.remove('on');
    send(v >= L.maxRaise ? 'allin' : 'raise', { amount: v });
  };
  $('raiseNo').onclick = function () { raiseOpen = false; box.classList.remove('on'); };
}

/* 保險絲：輪到我卻沒有東西可按就重畫 */
setInterval(function () {
  if (!ST || TAB !== 'table' || mySeat < 0) return;
  if (ST.hand.turnSeat !== mySeat) return;
  if (!$('bar').querySelector('[data-a]')) renderBar();
}, 2000);

})();
</script>
