<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a09">
<title>籌碼桌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

:root{
  --void:#04070F;
  --deep:#070D1A;
  --glass:rgba(12,26,46,.62);
  --glass-2:rgba(16,34,58,.5);
  --edge:rgba(88,190,255,.28);
  --edge-hot:rgba(120,220,255,.75);
  --cy:#3FC7FF;
  --cy-hi:#A8EEFF;
  --cy-dim:#2A7FA8;
  --gold:#FFD37A;
  --red:#FF4D6D;
  --grn:#4BE38F;
  --fg:#DCEEF8;
  --fg-dim:#7E9DB4;
  --fg-faint:#4E687C;
  --dsp:'Orbitron',sans-serif;
  --ui:'Rajdhani',sans-serif;
  --tc:'Noto Sans TC',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--void);color:var(--fg);
  font-family:var(--tc);font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;position:relative;
}
/* 環境光 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 520px at 50% -8%,rgba(63,199,255,.16),transparent 62%),
    radial-gradient(700px 480px at 92% 22%,rgba(63,199,255,.07),transparent 60%),
    radial-gradient(600px 400px at 4% 78%,rgba(63,199,255,.06),transparent 62%);
}
body>*{position:relative;z-index:1}

button{font-family:var(--tc);font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font-family:var(--ui);font-size:16px;font-weight:600}
:focus-visible{outline:1px solid var(--cy);outline-offset:3px}

/* ============ 面板 ============ */
.panel{
  position:relative;padding:22px;margin-bottom:16px;border-radius:4px;
  background:linear-gradient(160deg,var(--glass),var(--glass-2));
  border:1px solid var(--edge);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 0 1px rgba(63,199,255,.05),0 18px 50px rgba(0,0,0,.55),
             inset 0 1px 0 rgba(168,238,255,.12);
}
/* 上緣光條 */
.panel::before{
  content:'';position:absolute;left:16%;right:16%;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--edge-hot),transparent);
}
.rgb{border-color:rgba(88,190,255,.45)}
.rgb::before{left:8%;right:8%}

.panel h2{
  margin:0 0 16px;font-family:var(--dsp);font-size:11px;font-weight:700;
  color:var(--cy);letter-spacing:.22em;
  display:flex;align-items:center;gap:10px;
}
.panel h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}

.field{margin-bottom:14px}
.field label{
  display:block;color:var(--fg-dim);font-family:var(--tc);font-size:12px;
  font-weight:500;margin-bottom:7px;letter-spacing:.08em;
}
.field input,.field select{
  width:100%;padding:12px 13px;border-radius:3px;color:var(--fg);
  background:rgba(4,10,20,.66);border:1px solid var(--edge);
  transition:border-color .18s,box-shadow .18s;
}
.field input:focus,.field select:focus{
  border-color:var(--edge-hot);outline:none;
  box-shadow:0 0 0 3px rgba(63,199,255,.1),inset 0 0 24px rgba(63,199,255,.08);
}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* ============ 按鈕 ============ */
.btn{
  position:relative;display:block;width:100%;padding:14px;border-radius:3px;
  font-family:var(--dsp);font-weight:700;font-size:13px;letter-spacing:.14em;
  color:#04070F;overflow:hidden;
  background:linear-gradient(135deg,var(--cy-hi),var(--cy) 52%,#1FA5DE);
  box-shadow:0 6px 26px rgba(63,199,255,.3),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .1s,box-shadow .2s,filter .2s;
}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:hover{filter:brightness(1.08);box-shadow:0 8px 34px rgba(63,199,255,.45)}
.btn:disabled{opacity:.3;filter:grayscale(.8);cursor:not-allowed}

.btn.ghost{
  background:rgba(63,199,255,.07);color:var(--cy-hi);
  border:1px solid var(--edge);box-shadow:inset 0 0 22px rgba(63,199,255,.06);
}
.btn.ghost:hover{background:rgba(63,199,255,.16);border-color:var(--edge-hot)}
.btn.danger{
  background:linear-gradient(135deg,#FF8AA0,var(--red) 52%,#C8203F);color:#1A0308;
  box-shadow:0 6px 26px rgba(255,77,109,.3);
}

.iconbtn{
  padding:9px 13px;border-radius:3px;color:var(--cy-hi);font-family:var(--ui);font-weight:600;
  border:1px solid var(--edge);background:rgba(63,199,255,.07);transition:.18s;
}
.iconbtn:hover{background:rgba(63,199,255,.18);border-color:var(--edge-hot)}

.hint{color:var(--fg-faint);font-size:12.5px;line-height:1.8;font-weight:400}

/* ============ 登入 ============ */
.gate{max-width:410px;margin:0 auto;padding:56px 22px}
.brand{
  margin:0;font-family:var(--dsp);font-weight:900;font-size:40px;
  letter-spacing:.06em;line-height:1;color:var(--fg);
  text-shadow:0 0 30px rgba(63,199,255,.5);
}
.brand span{color:var(--cy);text-shadow:0 0 26px rgba(63,199,255,.85)}
.rule{
  height:1px;margin:20px 0 28px;
  background:linear-gradient(90deg,var(--edge-hot),rgba(63,199,255,.1) 60%,transparent);
}
.id-input{
  font-size:44px!important;text-align:center;letter-spacing:.3em;
  padding:16px 0 16px .3em!important;font-family:var(--dsp)!important;font-weight:900;
  color:var(--cy-hi)!important;text-shadow:0 0 26px rgba(63,199,255,.7);
}

/* ============ 牌桌 ============ */
.table-wrap{position:relative;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.topbar{
  display:flex;align-items:center;gap:11px;padding:12px 16px;flex:none;
  border-bottom:1px solid var(--edge);background:rgba(7,13,26,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.topbar .code{font-family:var(--dsp);font-size:12px;letter-spacing:.2em;color:var(--cy)}
.topbar .spacer{flex:1}
.chip-icon{
  width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--cy);
  box-shadow:0 0 12px var(--cy),0 0 26px rgba(63,199,255,.5);
}

/* 狀態條 */
.mybar{display:flex;gap:8px;padding:12px 14px 4px;flex:none}
.mybar .box{
  flex:1;text-align:center;padding:9px 3px;border-radius:3px;
  background:linear-gradient(160deg,var(--glass),var(--glass-2));
  border:1px solid var(--edge);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.mybar .k{font-size:10.5px;color:var(--fg-faint);letter-spacing:.14em;font-weight:500}
.mybar .v{
  font-family:var(--dsp);font-size:17px;font-weight:700;line-height:1.45;
  color:var(--cy-hi);text-shadow:0 0 16px rgba(63,199,255,.55);
}
.mybar .v.small{font-family:var(--tc);font-size:12.5px;font-weight:500;color:var(--fg);text-shadow:none}
.mybar .v.now{color:var(--gold);text-shadow:0 0 18px rgba(255,211,122,.75);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}

/* 桌面 */
.felt{
  position:relative;flex:1;margin:12px 14px 14px;min-height:330px;border-radius:44%/30%;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(63,199,255,.12),transparent 56%),
    radial-gradient(ellipse at 50% 46%,#0C2038,#070E1E 62%,#04070F);
  border:1px solid var(--edge);
  box-shadow:
    inset 0 0 90px rgba(0,0,0,.7),
    inset 0 0 44px rgba(63,199,255,.09),
    0 0 70px rgba(63,199,255,.13);
}
.felt::before{
  content:'';position:absolute;inset:18px;border-radius:44%/30%;pointer-events:none;
  border:1px solid rgba(63,199,255,.13);
}
.center{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);text-align:center;width:74%;z-index:3}
.pot-label{font-family:var(--dsp);color:var(--fg-faint);font-size:9.5px;letter-spacing:.36em;font-weight:500;margin-bottom:2px}
.pot{
  font-family:var(--dsp);font-weight:900;font-size:46px;line-height:1.1;
  color:var(--gold);letter-spacing:.01em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 6px rgba(255,211,122,.8),0 0 34px rgba(255,211,122,.45);
}
.pot.bump{animation:bump .34s ease-out}
@keyframes bump{0%{transform:scale(1)}36%{transform:scale(1.12)}100%{transform:scale(1)}}

.stack{display:flex;justify-content:center;gap:3px;height:15px;margin-top:10px}
.stack i{
  width:20px;height:5px;border-radius:2px;align-self:flex-end;background:var(--gold);
  box-shadow:0 0 12px rgba(255,211,122,.8);
  animation:rise .32s cubic-bezier(.2,1.6,.4,1) backwards;
}
.stack i:nth-child(even){background:var(--cy);box-shadow:0 0 12px rgba(63,199,255,.8);height:7px}
@keyframes rise{from{transform:translateY(12px) scaleX(.2);opacity:0}}

.phase{color:var(--fg-dim);font-size:11.5px;margin-top:11px;letter-spacing:.16em;font-weight:400}
.sidepots{font-family:var(--ui);font-size:11.5px;color:var(--fg-faint);margin-top:6px;font-weight:600}

/* 座位 */
.seat{position:absolute;transform:translate(-50%,-50%);width:96px;text-align:center;z-index:4}
.seat .card{
  position:relative;padding:9px 6px;border-radius:3px;
  background:linear-gradient(160deg,rgba(14,30,52,.9),rgba(8,16,30,.9));
  border:1px solid var(--edge);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(168,238,255,.1);
  transition:transform .22s,box-shadow .22s,border-color .22s;
}
.seat .card::before{
  content:'';position:absolute;left:22%;right:22%;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(120,220,255,.5),transparent);
}
.seat.empty .card{border-style:dashed;opacity:.34}
.seat.folded{opacity:.3;filter:saturate(.3)}
.seat.me .card{border-color:rgba(75,227,143,.45);box-shadow:0 0 22px rgba(75,227,143,.16),inset 0 1px 0 rgba(168,238,255,.1)}

.seat.turn{z-index:6}
.seat.turn .card{
  transform:scale(1.1);border-color:var(--edge-hot);
  box-shadow:0 0 0 1px rgba(120,220,255,.4),0 0 34px rgba(63,199,255,.5),
             inset 0 0 22px rgba(63,199,255,.14);
  animation:turnGlow 1.8s ease-in-out infinite;
}
@keyframes turnGlow{
  50%{box-shadow:0 0 0 1px rgba(120,220,255,.7),0 0 52px rgba(63,199,255,.75),inset 0 0 26px rgba(63,199,255,.2)}
}

.seat .nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ch{
  font-family:var(--dsp);font-weight:700;font-size:13px;color:var(--gold);
  text-shadow:0 0 12px rgba(255,211,122,.55);font-variant-numeric:tabular-nums;
}
.seat .st{font-size:10.5px;color:var(--fg-faint);letter-spacing:.06em}
.seat .allin{
  font-family:var(--dsp);font-weight:900;font-size:9.5px;color:var(--red);
  letter-spacing:.14em;text-shadow:0 0 14px rgba(255,77,109,.9);animation:blink 1.1s steps(2) infinite;
}
.seat .bet{
  margin-top:7px;font-family:var(--ui);font-weight:700;font-size:12px;color:#1A1204;
  background:linear-gradient(135deg,#FFE6AE,var(--gold));border-radius:20px;
  padding:2px 10px;display:inline-block;
  box-shadow:0 0 16px rgba(255,211,122,.65);
  animation:pop .26s cubic-bezier(.2,1.7,.4,1);
}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.seat .tag{
  position:absolute;top:-9px;right:-7px;font-family:var(--dsp);font-size:9px;font-weight:900;
  color:#04070F;border-radius:3px;padding:2px 7px;letter-spacing:.06em;
  background:linear-gradient(135deg,var(--cy-hi),var(--cy));
  box-shadow:0 0 16px rgba(63,199,255,.8);
}

/* 動作列 */
.actions{
  flex:none;padding:12px 14px 18px;
  border-top:1px solid var(--edge);background:rgba(7,13,26,.8);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.act-row{display:flex;gap:9px}
.act-row .btn{padding:17px 6px;font-size:13px}
.raise-box{display:none;margin-bottom:11px}
.raise-box.on{display:block;animation:slideUp .22s ease-out}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}}
.raise-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.raise-top input[type=number]{
  flex:1;padding:11px;border-radius:3px;text-align:center;
  font-family:var(--dsp);font-weight:900;font-size:20px;color:var(--gold);
  background:rgba(4,10,20,.7);border:1px solid rgba(255,211,122,.3);
  text-shadow:0 0 18px rgba(255,211,122,.6);
}
.quick{display:flex;gap:7px}
.quick button{
  flex:1;padding:9px 2px;border-radius:3px;font-family:var(--ui);font-weight:600;font-size:12.5px;
  color:var(--cy-hi);border:1px solid var(--edge);background:rgba(63,199,255,.06);transition:.16s;
}
.quick button:hover{background:rgba(63,199,255,.18);border-color:var(--edge-hot)}
input[type=range]{width:100%;accent-color:var(--cy);height:26px}
.waiting{text-align:center;color:var(--fg-faint);padding:18px 0;font-size:13px;letter-spacing:.1em}

/* 抽屜 */
.drawer{position:fixed;inset:0;z-index:60;background:rgba(2,4,10,.74);display:none;backdrop-filter:blur(6px)}
.drawer.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer-inner{
  position:absolute;right:0;top:0;bottom:0;width:min(410px,93vw);padding:22px;overflow-y:auto;
  background:linear-gradient(200deg,rgba(11,24,42,.97),rgba(5,9,18,.99));
  border-left:1px solid var(--edge);
  animation:slideIn .24s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideIn{from{transform:translateX(100%)}}
.drawer h3{margin:0 0 4px;font-family:var(--dsp);font-weight:700;font-size:17px;letter-spacing:.06em}
.drawer .sec{
  margin:24px 0 10px;font-family:var(--dsp);font-size:10.5px;font-weight:700;letter-spacing:.24em;
  color:var(--cy);display:flex;align-items:center;gap:10px;
}
.drawer .sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}

.pot-award{
  border:1px solid rgba(255,211,122,.26);border-radius:3px;padding:14px;margin-bottom:12px;
  background:rgba(255,211,122,.045);
}
.pot-award .h{font-family:var(--dsp);font-weight:700;color:var(--gold);margin-bottom:11px;font-size:12.5px;letter-spacing:.08em}
.winner-pick{display:flex;flex-wrap:wrap;gap:8px}
.winner-pick button{
  padding:10px 14px;border-radius:3px;font-size:13px;
  border:1px solid var(--edge);background:rgba(63,199,255,.05);transition:.16s;
}
.winner-pick button.on{
  background:linear-gradient(135deg,#FFE6AE,var(--gold));color:#1A1204;font-weight:700;
  border-color:transparent;box-shadow:0 0 24px rgba(255,211,122,.6);
}

.logbox{
  font-size:12px;color:var(--fg-dim);line-height:1.95;max-height:200px;overflow-y:auto;
  border-left:1px solid var(--edge);padding-left:13px;
}

.toast{
  position:fixed;left:50%;bottom:102px;transform:translate(-50%,14px);
  padding:13px 20px;border-radius:3px;font-size:13.5px;z-index:200;
  background:rgba(11,24,42,.96);border:1px solid var(--edge);color:var(--fg);
  box-shadow:0 14px 44px rgba(0,0,0,.6),0 0 30px rgba(63,199,255,.14);
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center;
  backdrop-filter:blur(12px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,77,109,.55);color:#FFC2CD;box-shadow:0 0 34px rgba(255,77,109,.3)}

.banner{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:6;
  background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.45);border-radius:3px;
  color:#FFC2CD;font-size:12px;padding:9px 15px;white-space:nowrap;letter-spacing:.06em;
  animation:blink 1.9s steps(2) infinite;
}

/* 贏牌 */
#burst{position:fixed;inset:0;pointer-events:none;z-index:800;display:none}
#burst.on{display:block}
#burst i{
  position:absolute;left:50%;top:44%;width:3px;height:13px;border-radius:2px;
  background:var(--gold);box-shadow:0 0 14px var(--gold);
  animation:fly .95s cubic-bezier(.15,.7,.3,1) forwards;
}
@keyframes fly{
  0%{transform:translate(-50%,-50%) scaleY(.3);opacity:1}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scaleY(1.4) rotate(var(--rot));opacity:0}
}

/* ============ 後台 ============ */
.admin{max-width:660px;margin:0 auto;padding:24px 18px 76px}
.admin h1{
  font-family:var(--dsp);font-weight:900;font-size:24px;margin:6px 0 0;
  color:var(--fg);letter-spacing:.06em;text-shadow:0 0 26px rgba(63,199,255,.45);
}
.admin h1 span{color:var(--cy)}
.prow{display:flex;align-items:center;gap:9px;padding:13px 0;border-bottom:1px solid rgba(88,190,255,.1)}
.prow .id{font-family:var(--dsp);font-weight:900;font-size:16px;min-width:38px;text-align:center;color:var(--cy);text-shadow:0 0 14px rgba(63,199,255,.5)}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-size:14px;font-weight:500}
.prow .who small{color:var(--fg-faint);font-size:11px}
.prow .money{
  font-family:var(--dsp);font-weight:700;font-size:15px;min-width:66px;text-align:right;
  color:var(--gold);text-shadow:0 0 14px rgba(255,211,122,.5);font-variant-numeric:tabular-nums;
}
.prow button{
  padding:8px 11px;border-radius:3px;font-size:12px;color:var(--cy-hi);
  border:1px solid var(--edge);background:rgba(63,199,255,.06);transition:.16s;
}
.prow button:hover{background:rgba(63,199,255,.18);border-color:var(--edge-hot)}
.prow.out{opacity:.42}
.prow.out .money{color:var(--red);text-shadow:none}

.totals{display:flex;gap:10px;margin-bottom:18px}
.totals div{
  flex:1;padding:14px 8px;text-align:center;border-radius:3px;
  background:linear-gradient(160deg,var(--glass),var(--glass-2));
  border:1px solid var(--edge);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.totals .k{font-size:11px;color:var(--fg-faint);letter-spacing:.16em;font-weight:500}
.totals .v{
  font-family:var(--dsp);font-weight:900;font-size:21px;color:var(--cy-hi);
  text-shadow:0 0 20px rgba(63,199,255,.5);font-variant-numeric:tabular-nums;
}

@media (max-width:400px){
  .seat{width:82px}
  .seat .nm{font-size:11px}
  .pot{font-size:38px}
  .brand{font-size:33px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>
</head>
<body>

<div id="gateView" class="gate">
  <h1 class="brand">籌碼<span>桌</span></h1>
  <div class="rule"></div>

  <div class="panel rgb">
    <div class="field">
      <label for="pid">你的編號</label>
      <input id="pid" class="id-input" maxlength="2" inputmode="numeric" placeholder="00" autocomplete="off">
    </div>
    <div class="field" id="nameWrap" style="display:none">
      <label for="pname">你的名字</label>
      <input id="pname" maxlength="12" placeholder="桌上會顯示這個" autocomplete="off">
    </div>
    <div class="field">
      <label for="pw" id="pwLabel">密碼</label>
      <input id="pw" type="password" placeholder="輸入密碼" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" disabled>進入牌桌</button>
    <p class="hint" id="gateHint" style="margin-top:12px">
      打一組沒人用過的兩位數編號就能註冊。
    </p>
  </div>
</div>

<div id="tableView" class="table-wrap" style="display:none">

  <div class="topbar">
    <span class="chip-icon"></span>
    <span class="code" id="whoami">--</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="drawerBtn">☰</button>
  </div>

  <div class="mybar">
    <div class="box"><div class="k">座位</div><div class="v" id="mySeatNo">—</div></div>
    <div class="box"><div class="k">我的籌碼</div><div class="v" id="myChips">—</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* engine.js — 純籌碼引擎，不碰 Firebase。
   輸入 state + action，輸出新的 state。可以單獨測試。 */
(function (g) {
  'use strict';
  var E = {};

  var PHASES = ['preflop', 'flop', 'turn', 'river'];

  E.defaultSettings = function () {
    return {
      seatCount: 10,
      sb: 25,
      bb: 50,
      startingChips: 5000,
      joinMode: 'anyone',      // anyone | hostOnly
      lateEntry: 'postBB',     // postBB | waitBB
      autoNext: true,          // 一手結束後自動開下一手
      autoDelay: 6,            // 幾秒後開
      disconnectSec: 30
    };
  };

  E.newRoom = function (settings) {
    return {
      status: 'lobby',
      settings: settings,
      seats: Array.from({ length: settings.seatCount }, function () { return null; }),
      hand: {
        no: 0, dealerSeat: -1, sbSeat: -1, bbSeat: -1,
        phase: 'idle', turnSeat: -1, currentBet: 0, minRaise: settings.bb
      },
      pots: [],
      pendingAward: null,
      log: []
    };
  };

  E.newPlayer = function (uid, name, chips, seat) {
    return {
      uid: uid, name: name, chips: chips, seat: seat,
      bet: 0, committed: 0,
      folded: false, allIn: false, acted: false,
      state: 'waiting',        // playing | waiting | sitout
      waitFromDealer: -1,
      lastSeen: Date.now()
    };
  };

  /* ---------- 查詢 ---------- */
  function inHand(s) { return s && s.state === 'playing' && !s.folded; }
  function canAct(s) { return inHand(s) && !s.allIn && s.chips > 0; }
  function seatedPlaying(s) { return s && s.state === 'playing'; }

  function countWhere(seats, fn) {
    var c = 0;
    for (var i = 0; i < seats.length; i++) if (fn(seats[i])) c++;
    return c;
  }

  function nextIdx(seats, from, pred) {
    var n = seats.length;
    for (var k = 1; k <= n; k++) {
      var i = ((from % n) + n + k) % n;
      if (pred(seats[i], i)) return i;
    }
    return -1;
  }

  /* 從 a 出發往前走，是否會在到達 b 之前（含 b）經過 x */
  function arcContains(n, a, b, x) {
    for (var k = 1; k <= n; k++) {
      var i = (a + k) % n;
      if (i === x) return true;
      if (i === b) return false;
    }
    return false;
  }

  E.seatOf = function (st, uid) {
    for (var i = 0; i < st.seats.length; i++) if (st.seats[i] && st.seats[i].uid === uid) return i;
    return -1;
  };

  function log(st, text) {
    st.log = (st.log || []).concat([{ t: Date.now(), text: text }]).slice(-25);
  }

  /* ---------- 入座 / 離座 ---------- */
  E.sit = function (st, uid, name, seat) {
    if (seat < 0 || seat >= st.seats.length) throw new Error('座位不存在');
    if (st.seats[seat]) throw new Error('這個位子有人了');
    if (E.seatOf(st, uid) >= 0) throw new Error('你已經在桌上了');
    var p = E.newPlayer(uid, name, st.settings.startingChips, seat);
    if (st.hand.phase === 'idle') {
      p.state = 'playing';
    } else {
      p.state = 'waiting';
      p.waitFromDealer = st.hand.dealerSeat;
    }
    st.seats[seat] = p;
    log(st, name + ' 坐上 ' + (seat + 1) + ' 號位');
    return st;
  };

  E.leave = function (st, seat) {
    var p = st.seats[seat];
    if (!p) return st;
    if (st.hand.phase !== 'idle' && inHand(p)) {
      p.folded = true; p.acted = true;
      p.state = 'sitout';
      log(st, p.name + ' 離桌（視同蓋牌）');
      if (st.hand.turnSeat === seat) advanceTurnOrStreet(st);
      return st;
    }
    log(st, p.name + ' 離桌');
    st.seats[seat] = null;
    return st;
  };

  E.move = function (st, from, to) {
    if (st.hand.phase !== 'idle') throw new Error('牌局進行中不能換位，下一手才生效');
    if (!st.seats[from]) throw new Error('那個位子沒人');
    if (st.seats[to]) throw new Error('目標位子有人');
    st.seats[to] = st.seats[from];
    st.seats[to].seat = to;
    st.seats[from] = null;
    log(st, st.seats[to].name + ' 換到 ' + (to + 1) + ' 號位');
    return st;
  };

  E.setSitout = function (st, seat, out) {
    var p = st.seats[seat];
    if (!p) return st;
    if (out) {
      if (inHand(p) && st.hand.phase !== 'idle') { p.folded = true; p.acted = true; }
      p.state = 'sitout';
      log(st, p.name + ' 暫離');
      if (st.hand.turnSeat === seat) advanceTurnOrStreet(st);
    } else {
      p.state = st.hand.phase === 'idle' ? 'playing' : 'waiting';
      p.waitFromDealer = st.hand.dealerSeat;
      log(st, p.name + ' 回桌');
    }
    return st;
  };

  E.addChips = function (st, seat, amount) {
    var p = st.seats[seat];
    if (!p) throw new Error('那個位子沒人');
    p.chips += amount;
    if (p.state === 'sitout' && p.chips > 0) {
      p.state = st.hand.phase === 'idle' ? 'playing' : 'waiting';
      p.waitFromDealer = st.hand.dealerSeat;
    }
    log(st, p.name + ' 補碼 ' + amount);
    return st;
  };

  /* ---------- 開新一手 ---------- */
  E.startHand = function (st, forcedDealer) {
    if (st.hand.phase !== 'idle') throw new Error('上一手還沒結束');
    var n = st.seats.length, i;

    // 沒籌碼的自動暫離
    for (i = 0; i < n; i++) {
      var s = st.seats[i];
      if (s && s.chips <= 0 && s.state !== 'sitout') { s.state = 'sitout'; }
    }

    var prevDealer = st.hand.dealerSeat;
    var dealerSeat;
    if (typeof forcedDealer === 'number' && forcedDealer >= 0) {
      if (!seatedPlaying(st.seats[forcedDealer])) throw new Error('指定的莊家位沒有在玩的人');
      dealerSeat = forcedDealer;
    } else {
      dealerSeat = nextIdx(st.seats, prevDealer < 0 ? n - 1 : prevDealer, seatedPlaying);
    }
    if (dealerSeat < 0) throw new Error('桌上人不夠');

    // 補位者入場判定
    for (i = 0; i < n; i++) {
      var w = st.seats[i];
      if (!w || w.state !== 'waiting' || w.chips <= 0) continue;
      if (st.settings.lateEntry === 'postBB') {
        w.state = 'playing';
        w.pendingDead = st.settings.bb;   // 補一個大盲當死錢
      } else {
        var from = w.waitFromDealer < 0 ? prevDealer : w.waitFromDealer;
        if (from < 0 || arcContains(n, from, dealerSeat, i) || from === dealerSeat) {
          w.state = 'playing';
        }
      }
    }

    var playing = [];
    for (i = 0; i < n; i++) if (seatedPlaying(st.seats[i]) && st.seats[i].chips > 0) playing.push(i);
    if (playing.length < 2) throw new Error('至少要兩個有籌碼的人才能開牌');
    if (!seatedPlaying(st.seats[dealerSeat]) || st.seats[dealerSeat].chips <= 0) {
      dealerSeat = nextIdx(st.seats, dealerSeat, function (s) { return seatedPlaying(s) && s.chips > 0; });
    }

    var headsUp = playing.length === 2;
    var sbSeat, bbSeat;
    if (headsUp) {
      sbSeat = dealerSeat;
      bbSeat = nextIdx(st.seats, dealerSeat, function (s) { return seatedPlaying(s) && s.chips > 0; });
    } else {
      sbSeat = nextIdx(st.seats, dealerSeat, function (s) { return seatedPlaying(s) && s.chips > 0; });
      bbSeat = nextIdx(st.seats, sbSeat, function (s) { return seatedPlaying(s) && s.chips > 0; });
    }

    // 重置
    for (i = 0; i < n; i++) {
      var p = st.seats[i];
      if (!p) continue;
      p.bet = 0; p.committed = 0; p.folded = false; p.allIn = false; p.acted = false;
      if (p.state === 'playing' && p.chips <= 0) p.state = 'sitout';
    }

    st.hand = {
      no: st.hand.no + 1,
      dealerSeat: dealerSeat, sbSeat: sbSeat, bbSeat: bbSeat,
      phase: 'preflop', turnSeat: -1,
      currentBet: 0, minRaise: st.settings.bb
    };
    st.pots = [];
    st.pendingAward = null;
    st.status = 'playing';

    // 死錢（補大盲入場）
    for (i = 0; i < n; i++) {
      var d = st.seats[i];
      if (d && d.pendingDead && i !== sbSeat && i !== bbSeat) {
        var amt = Math.min(d.pendingDead, d.chips);
        d.chips -= amt; d.committed += amt;
        if (d.chips === 0) d.allIn = true;
        log(st, d.name + ' 補大盲入場 ' + amt);
      }
      if (d) delete d.pendingDead;
    }

    postBlind(st, sbSeat, st.settings.sb, '小盲');
    postBlind(st, bbSeat, st.settings.bb, '大盲');
    st.hand.currentBet = st.settings.bb;
    st.hand.minRaise = st.settings.bb;

    st.hand.turnSeat = headsUp
      ? sbSeat
      : nextIdx(st.seats, bbSeat, canAct);

    // 貼完盲注就全下的話，這個位子其實不能動作，往下找
    if (st.hand.turnSeat >= 0 && !canAct(st.seats[st.hand.turnSeat])) {
      st.hand.turnSeat = nextIdx(st.seats, st.hand.turnSeat, canAct);
    }
    if (st.hand.turnSeat < 0 || roundDone(st)) settleStreet(st);
    log(st, '— 第 ' + st.hand.no + ' 手開始，莊家 ' + (dealerSeat + 1) + ' 號位 —');
    return st;
  };

  function postBlind(st, seat, amount, label) {
    var p = st.seats[seat];
    if (!p) return;
    var pay = Math.min(amount, p.chips);
    p.chips -= pay; p.bet += pay;
    if (p.chips === 0) p.allIn = true;
    log(st, p.name + ' ' + label + ' ' + pay);
  }

  /* ---------- 玩家動作 ---------- */
  E.act = function (st, seat, type, amount) {
    var p = st.seats[seat];
    if (!p) throw new Error('那個位子沒人');
    if (st.hand.phase === 'idle' || st.hand.phase === 'showdown') throw new Error('現在不能動作');
    if (st.hand.turnSeat !== seat) throw new Error('還沒輪到你');
    if (!canAct(p)) throw new Error('你現在不能動作');

    var need = st.hand.currentBet - p.bet;

    if (type === 'fold') {
      p.folded = true; p.acted = true;
      log(st, p.name + ' 蓋牌');

    } else if (type === 'check') {
      if (need > 0) throw new Error('有人下注了，不能過牌');
      p.acted = true;
      log(st, p.name + ' 過牌');

    } else if (type === 'call') {
      var pay = Math.min(need, p.chips);
      p.chips -= pay; p.bet += pay; p.acted = true;
      if (p.chips === 0) p.allIn = true;
      log(st, p.name + (pay === 0 ? ' 過牌' : (p.allIn ? ' 全下跟注 ' : ' 跟注 ') + fmtn(pay)));

    } else if (type === 'raise' || type === 'bet' || type === 'allin') {
      var target;
      if (type === 'allin') {
        target = p.bet + p.chips;
      } else {
        target = Math.round(amount);
        if (!(target > 0)) throw new Error('金額不對');
        if (target > p.bet + p.chips) throw new Error('籌碼不夠');
      }
      var isAllIn = target === p.bet + p.chips;

      // 全下但蓋不過目前注額 → 等同全下跟注，不是加注
      if (target <= st.hand.currentBet) {
        if (!isAllIn) throw new Error('加注要大於目前注額');
        var short = p.chips;
        p.chips = 0; p.bet += short; p.allIn = true; p.acted = true;
        log(st, p.name + ' 全下跟注 ' + fmtn(short));
        advanceTurnOrStreet(st);
        return st;
      }

      var inc = target - st.hand.currentBet;
      if (inc < st.hand.minRaise && !isAllIn) {
        throw new Error('最少要加到 ' + fmtn(st.hand.currentBet + st.hand.minRaise));
      }
      var delta = target - p.bet;
      p.chips -= delta; p.bet = target;
      if (p.chips === 0) p.allIn = true;

      if (inc >= st.hand.minRaise) {
        st.hand.minRaise = inc;
        // 完整加注 → 其他人重新取得行動權
        for (var i = 0; i < st.seats.length; i++) {
          var o = st.seats[i];
          if (o && i !== seat && canAct(o)) o.acted = false;
        }
      }
      st.hand.currentBet = target;
      p.acted = true;
      log(st, p.name + (p.allIn ? ' 全下 ' : ' 加注到 ') + fmtn(target));

    } else {
      throw new Error('未知的動作');
    }

    advanceTurnOrStreet(st);
    return st;
  };

  function fmtn(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  /* ---------- 流程推進 ---------- */
  function roundDone(st) {
    var live = [];
    for (var i = 0; i < st.seats.length; i++) if (canAct(st.seats[i])) live.push(st.seats[i]);
    if (countWhere(st.seats, inHand) <= 1) return true;
    if (live.length === 0) return true;
    for (var j = 0; j < live.length; j++) {
      if (!live[j].acted || live[j].bet !== st.hand.currentBet) return false;
    }
    return true;
  }

  function advanceTurnOrStreet(st) {
    if (countWhere(st.seats, inHand) <= 1) { settleStreet(st); return; }
    if (roundDone(st)) { settleStreet(st); return; }
    var nxt = nextIdx(st.seats, st.hand.turnSeat, canAct);
    st.hand.turnSeat = nxt;
    if (nxt < 0) settleStreet(st);
  }

  function collectBets(st) {
    for (var i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (!p) continue;
      p.committed += p.bet;
      p.bet = 0;
      p.acted = false;
    }
    st.hand.currentBet = 0;
    st.hand.minRaise = st.settings.bb;
  }

  /* 沒人跟得起的那一段下注要退回去，不能留在池子裡 */
  function refundUncalled(st) {
    var idx = -1, max = -1, second = -1, i;
    for (i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (!p) continue;
      var c = p.committed;
      if (c > max) { second = max; max = c; idx = i; }
      else if (c > second) { second = c; }
    }
    if (idx < 0 || second < 0 || max <= second) return;
    var back = max - second;
    var w = st.seats[idx];
    w.chips += back;
    w.committed = second;
    w.allIn = w.chips === 0;
    log(st, w.name + ' 沒人跟，退回 ' + fmtn(back));
  }

  function settleStreet(st) {
    collectBets(st);
    refundUncalled(st);

    // 只剩一個人沒蓋牌 → 直接結算
    if (countWhere(st.seats, inHand) <= 1) {
      var winner = -1;
      for (var i = 0; i < st.seats.length; i++) if (inHand(st.seats[i])) winner = i;
      st.pots = E.buildPots(st.seats);
      st.hand.phase = 'showdown';
      st.hand.turnSeat = -1;
      if (winner >= 0) {
        st.pendingAward = { pots: st.pots, resolved: st.pots.map(function () { return null; }) };
        for (var k = 0; k < st.pots.length; k++) E.award(st, k, [winner]);
      }
      return;
    }

    var canActCount = countWhere(st.seats, canAct);
    var idx = PHASES.indexOf(st.hand.phase);

    // 大家都 all-in → 直接跳到攤牌
    if (canActCount <= 1) {
      var stillNeeds = false;
      for (var m = 0; m < st.seats.length; m++) {
        var q = st.seats[m];
        if (canAct(q) && q.committed < maxCommitted(st)) stillNeeds = true;
      }
      if (!stillNeeds) { toShowdown(st); return; }
    }

    if (idx >= PHASES.length - 1) { toShowdown(st); return; }

    st.hand.phase = PHASES[idx + 1];
    var first = nextIdx(st.seats, st.hand.dealerSeat, canAct);
    st.hand.turnSeat = countWhere(st.seats, canAct) >= 2 ? first : -1;
    log(st, '— ' + phaseName(st.hand.phase) + ' —');
    if (st.hand.turnSeat < 0) settleStreet(st);
  }

  function maxCommitted(st) {
    var mx = 0;
    for (var i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (p && inHand(p)) mx = Math.max(mx, p.committed);
    }
    return mx;
  }

  function phaseName(p) {
    return { preflop: '翻牌前', flop: '翻牌', turn: '轉牌', river: '河牌', showdown: '攤牌' }[p] || p;
  }
  E.phaseName = phaseName;

  function toShowdown(st) {
    st.hand.phase = 'showdown';
    st.hand.turnSeat = -1;
    st.pots = E.buildPots(st.seats);
    st.pendingAward = { pots: st.pots, resolved: st.pots.map(function () { return null; }) };
    log(st, '— 攤牌，請房主選出贏家 —');
  }

  /* ---------- 邊池 ---------- */
  E.buildPots = function (seats) {
    var contrib = seats.map(function (s) { return s ? s.committed + s.bet : 0; });
    var alive = seats.map(function (s) { return !!(s && s.state === 'playing' && !s.folded); });

    var levels = [];
    contrib.forEach(function (c) { if (c > 0 && levels.indexOf(c) < 0) levels.push(c); });
    levels.sort(function (a, b) { return a - b; });

    var pots = [], prev = 0;
    levels.forEach(function (lv) {
      var amount = 0, elig = [];
      contrib.forEach(function (c, i) {
        amount += Math.min(c, lv) - Math.min(c, prev);
        if (c >= lv && alive[i]) elig.push(i);
      });
      if (amount > 0) pots.push({ amount: amount, eligible: elig });
      prev = lv;
    });

    // 合併資格相同的相鄰池
    var merged = [];
    pots.forEach(function (p) {
      var last = merged[merged.length - 1];
      if (last && (p.eligible.length === 0 || last.eligible.join(',') === p.eligible.join(','))) {
        last.amount += p.amount;
      } else {
        merged.push({ amount: p.amount, eligible: p.eligible.slice() });
      }
    });
    return merged;
  };

  /* ---------- 分池 ---------- */
  E.award = function (st, potIndex, winnerSeats) {
    if (!st.pendingAward) throw new Error('現在沒有要分的池');
    var pot = st.pendingAward.pots[potIndex];
    if (!pot) throw new Error('池不存在');
    if (st.pendingAward.resolved[potIndex]) throw new Error('這個池已經分過了');
    if (!winnerSeats.length) throw new Error('要選至少一個贏家');
    for (var i = 0; i < winnerSeats.length; i++) {
      if (pot.eligible.indexOf(winnerSeats[i]) < 0) throw new Error('有人沒有這個池的資格');
    }

    var each = Math.floor(pot.amount / winnerSeats.length);
    var rem = pot.amount - each * winnerSeats.length;
    var ordered = orderFromDealer(st, winnerSeats);
    ordered.forEach(function (seat, k) {
      st.seats[seat].chips += each + (k < rem ? 1 : 0);
    });
    st.pendingAward.resolved[potIndex] = ordered.slice();
    log(st, (potIndex === 0 ? '主池 ' : '邊池' + potIndex + ' ') + fmtn(pot.amount) + ' → ' +
      ordered.map(function (s) { return st.seats[s].name; }).join('、'));

    var allDone = st.pendingAward.resolved.every(function (r) { return !!r; });
    if (allDone) endHand(st);
    return st;
  };

  function orderFromDealer(st, seats) {
    var n = st.seats.length, d = st.hand.dealerSeat;
    return seats.slice().sort(function (a, b) {
      return ((a - d + n) % n) - ((b - d + n) % n);
    });
  }

  function endHand(st) {
    var results = [];
    for (var i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (!p) continue;
      results.push({ uid: p.uid, name: p.name, spent: p.committed + p.bet, chips: p.chips });
      p.bet = 0; p.committed = 0; p.folded = false; p.allIn = false; p.acted = false;
      if (p.chips <= 0) p.state = 'sitout';
      else if (p.state === 'playing') p.state = 'playing';
    }
    st.hand.phase = 'idle';
    st.hand.turnSeat = -1;
    st.pots = [];
    st.pendingAward = null;
    st.lastResults = results;
  }

  /* ---------- 給 UI 用的輔助 ---------- */
  E.potTotal = function (st) {
    var t = 0;
    for (var i = 0; i < st.seats.length; i++) {
      var p = st.seats[i];
      if (p) t += p.committed + p.bet;
    }
    return t;
  };

  E.legalMoves = function (st, seat) {
    var p = st.seats[seat];
    var out = { fold: false, check: false, call: 0, minRaise: 0, maxRaise: 0 };
    if (!p || st.hand.turnSeat !== seat || !canAct(p)) return out;
    var need = st.hand.currentBet - p.bet;
    out.fold = true;
    out.check = need === 0;
    out.call = Math.min(need, p.chips);
    out.maxRaise = p.bet + p.chips;
    var min = st.hand.currentBet + st.hand.minRaise;
    out.minRaise = Math.min(min, out.maxRaise);
    if (out.maxRaise <= st.hand.currentBet) { out.minRaise = 0; out.maxRaise = 0; }
    return out;
  };

  /* 還要幾手才輪到你當大盲／小盲。0 = 這一手就是你 */
  E.handsUntil = function (st, seat, which) {
    var active = [], i;
    for (i = 0; i < st.seats.length; i++) {
      var s = st.seats[i];
      if (s && s.state === 'playing' && s.chips > 0) active.push(i);
    }
    if (active.length < 2) return -1;
    var mi = active.indexOf(seat);
    if (mi < 0) return -1;
    var ref = which === 'sb' ? st.hand.sbSeat : st.hand.bbSeat;
    var ri = active.indexOf(ref);
    if (ri < 0) return -1;
    return ((mi - ri) % active.length + active.length) % active.length;
  };

  E.positionLabel = function (st, seat) {
    if (st.hand.phase === 'idle') return '';
    if (seat === st.hand.dealerSeat) return 'D';
    if (seat === st.hand.sbSeat) return 'SB';
    if (seat === st.hand.bbSeat) return 'BB';
    return '';
  };

  g.Engine = E;
})(window);

</script>
<script>
(function(){
'use strict';
/* ================= Firebase ================= */
var FB_CONFIG = {
  apiKey: "AIzaSyC1ypnHgPuhjoe6u7D-opVzQSZEgv9q34k",
  authDomain: "token-77aaf.firebaseapp.com",
  projectId: "token-77aaf",
  storageBucket: "token-77aaf.firebasestorage.app",
  messagingSenderId: "1055537384689",
  appId: "1:1055537384689:web:84544d089ab33f7e12ad50",
  measurementId: "G-BEE6LSR74B"
};
firebase.initializeApp(FB_CONFIG);
var db = firebase.firestore();
var auth = firebase.auth();
var FV = firebase.firestore.FieldValue;

var TABLE = db.collection('tables').doc('main');
var uid = null;

/* ================= 小工具 ================= */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function $(id) { return document.getElementById(id); }
function fmt(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function toast(msg, kind) {
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.className = 'toast'; }, 2800);
}

var wakeLock = null;
function keepAwake() {
  if (!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function (l) {
    wakeLock = l;
    l.addEventListener('release', function () { wakeLock = null; });
  }).catch(function () {});
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && !wakeLock && window.__isHost) keepAwake();
});

/* 匿名登入 — 給安全規則一個穩定的身分 */
function signIn() {
  return new Promise(function (resolve, reject) {
    var done = false;
    auth.onAuthStateChanged(function (u) { if (u && !done) { done = true; uid = u.uid; resolve(u.uid); } });
    auth.signInAnonymously().catch(function (e) { if (!done) { done = true; reject(e); } });
  });
}

/* 密碼驗證：不把密碼撈回來比對，而是寫進驗證文件讓安全規則去比。
   寫得進去代表對，被擋代表錯。密碼本身瀏覽器讀不到。 */
function tryPassword(claimRef, pw) {
  return claimRef.set({ pw: pw, at: FV.serverTimestamp() });
}


/* ================= 特效 ================= */
var FX = { muted: LS.get('muted', false), _ac: null, _potShown: 0 };

function ac() {
  if (!FX._ac) {
    var C = window.AudioContext || window.webkitAudioContext;
    if (C) FX._ac = new C();
  }
  if (FX._ac && FX._ac.state === 'suspended') FX._ac.resume();
  return FX._ac;
}

/* 合成音，不用載音檔 */
function blip(freq, dur, type, vol) {
  if (FX.muted) return;
  var a = ac(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(vol || .16, a.currentTime + .012);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + (dur || .16));
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + (dur || .16) + .02);
}

var SFX = {
  turn: function () { blip(880, .12, 'triangle', .2); setTimeout(function () { blip(1320, .18, 'triangle', .18); }, 110); },
  chip: function () { blip(1600, .05, 'square', .07); },
  win:  function () { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { blip(f, .3, 'triangle', .17); }, i * 95); }); },
  bad:  function () { blip(180, .22, 'sawtooth', .12); }
};

function buzz(pattern) {
  if (FX.muted) return;
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
}

/* 底池數字滾動 */
function setPot(to) {
  var el = $('pot');
  if (!el) return;
  var from = FX._potShown;
  if (from === to) return;
  FX._potShown = to;
  if (to > from) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); SFX.chip(); }
  var t0 = performance.now(), dur = 420;
  function step(t) {
    var k = Math.min(1, (t - t0) / dur);
    var e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
    else el.textContent = fmt(to);
  }
  requestAnimationFrame(step);
}

/* 籌碼堆 */
function setStack(total, bb) {
  var el = $('stack');
  if (!el) return;
  var n = Math.max(0, Math.min(9, Math.round(total / Math.max(bb || 50, 1))));
  if (el.childElementCount === n) return;
  var h = '';
  for (var i = 0; i < n; i++) h += '<i style="animation-delay:' + (i * 42) + 'ms"></i>';
  el.innerHTML = h;
}

/* 贏牌金光 */
function burst() {
  var el = $('burst');
  if (!el) return;
  var h = '';
  for (var i = 0; i < 44; i++) {
    var a = Math.random() * Math.PI * 2, d = 110 + Math.random() * 260;
    h += '<i style="--dx:' + Math.cos(a) * d + 'px;--dy:' + Math.sin(a) * d +
         'px;--rot:' + (a * 180 / Math.PI + 90) + 'deg;animation-delay:' +
         (Math.random() * 130) + 'ms"></i>';
  }
  el.innerHTML = h;
  el.classList.add('on');
  SFX.win();
  buzz([40, 60, 40, 60, 120]);
  clearTimeout(burst._t);
  burst._t = setTimeout(function () { el.classList.remove('on'); el.innerHTML = ''; }, 1300);
}

/* 輪到你 */
var _wasMyTurn = false;
function turnAlert(isMine) {
  if (isMine && !_wasMyTurn) { SFX.turn(); buzz([25, 45, 25]); }
  _wasMyTurn = isMine;
}


/* ================= 前台 ================= */
var myId = null, ST = null, mySeat = -1, raiseOpen = false, unsubs = [];

/* ---------- 註冊 / 登入 ---------- */
var myName = '', isNew = false;

$('pid').addEventListener('input', function () {
  var v = this.value.replace(/\D/g, '').slice(0, 2);
  this.value = v;
  if (v.length === 2) lookup(v); else setMode(null);
});

function setMode(reg, name) {
  isNew = reg === true;
  var lab = $('pwLabel'), hint = $('gateHint'), btn = $('loginBtn');
  $('nameWrap').style.display = reg === true ? '' : 'none';
  if (reg === null) {
    lab.textContent = '密碼';
    hint.textContent = '打一組沒人用過的兩位數編號就能註冊。';
    btn.textContent = '進入牌桌';
  } else if (reg) {
    lab.textContent = '設一組密碼';
    hint.textContent = '這個編號還沒人用，填完就是你的。之後登入都用這組。';
    btn.textContent = '註冊並入座';
  } else {
    lab.textContent = '密碼';
    hint.textContent = '這個編號是「' + name + '」，打你設過的密碼。';
    btn.textContent = '進入牌桌';
  }
}

function lookup(id) {
  db.collection('roster').doc(id).get().then(function (s) {
    if (s.exists) setMode(false, s.data().name || id);
    else setMode(true);
  }).catch(function () { setMode(null); });
}

$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

$('loginBtn').addEventListener('click', function () {
  var id = $('pid').value.trim(), pw = $('pw').value, nm = $('pname').value.trim();
  if (!/^\d{2}$/.test(id)) return toast('編號是兩位數字', 'bad');
  if (!pw) return toast('要打密碼', 'bad');
  if (isNew && !nm) return toast('要填名字', 'bad');

  var btn = this; btn.disabled = true;
  var rosterRef = db.collection('roster').doc(id);
  var pwRef = rosterRef.collection('private').doc('pw');
  var claimRef = rosterRef.collection('claims').doc(uid);

  var step;
  if (isNew) {
    step = rosterRef.set({ name: nm })
      .then(function () { return pwRef.set({ pw: pw }); })
      .then(function () { return tryPassword(claimRef, pw); })
      .then(function () { myName = nm; });
  } else {
    step = rosterRef.get().then(function (s) {
      if (!s.exists) throw { code: 'gone' };
      myName = s.data().name || id;
      return tryPassword(claimRef, pw).catch(function () { throw { code: 'bad-pw' }; });
    });
  }

  step.then(function () {
    myId = id;
    LS.set('lastId', id);
    startTable();
    return send('join', { name: myName });
  }).catch(function (e) {
    btn.disabled = false;
    if (e && e.code === 'bad-pw') toast('密碼不對', 'bad');
    else if (e && e.code === 'gone') toast('這個編號不見了，重新整理看看', 'bad');
    else toast('進不去，這個編號可能剛被別人註冊走了', 'bad');
  });
});

$('pid').value = LS.get('lastId', '');
if ($('pid').value.length === 2) lookup($('pid').value);

/* ---------- 進桌 ---------- */
function startTable() {
  $('gateView').style.display = 'none';
  $('tableView').style.display = '';
  $('whoami').textContent = '編號 ' + myId;

  unsubs.push(db.collection('tables').doc('main').collection('errors').doc(myId)
    .onSnapshot(function (s) {
      if (s.exists && s.data().msg) { toast(s.data().msg, 'bad'); s.ref.delete().catch(function () {}); }
    }, function () {}));

  unsubs.push(TABLE.onSnapshot(function (snap) {
    if (!snap.exists) { toast('後台還沒開桌', 'bad'); return; }
    var d = snap.data();
    ST = {
      status: d.status, settings: d.settings, seats: d.seats || [], hand: d.hand,
      pots: d.pots || [], pendingAward: d.pendingAward || null, log: d.log || []
    };
    mySeat = Engine.seatOf(ST, myId);
    checkAdminAlive(d);
    render();
  }, function (e) { toast('連線問題：' + e.code, 'bad'); }));
}

function checkAdminAlive(d) {
  var hb = d.hostHeartbeat && d.hostHeartbeat.toMillis ? d.hostHeartbeat.toMillis() : 0;
  var stale = Date.now() - hb > 20000;
  $('banner').style.display = stale ? '' : 'none';
  if (stale) $('banner').textContent = '後台離線了，等主辦把頁面打開';
}

function send(type, extra) {
  var a = { id: myId, type: type, ts: FV.serverTimestamp() };
  if (extra) for (var k in extra) a[k] = extra[k];
  return TABLE.collection('actions').add(a)
    .catch(function (e) { toast('送不出去：' + e.code, 'bad'); });
}

/* ---------- 畫面 ---------- */
var _lastChips = null, _lastHandNo = 0;
function render() {
  if (!ST) return;
  turnAlert(ST.hand.turnSeat >= 0 && ST.hand.turnSeat === mySeat);
  var me = mySeat >= 0 ? ST.seats[mySeat] : null;
  if (me) {
    if (_lastChips !== null && ST.hand.no === _lastHandNo &&
        ST.hand.phase === 'idle' && me.chips > _lastChips) burst();
    _lastChips = me.chips;
    _lastHandNo = ST.hand.no;
  }
  renderMyBar();
  renderSeats();
  renderCenter();
  renderActions();
  if ($('drawer').classList.contains('on')) renderDrawer();
}

function renderMyBar() {
  var me = mySeat >= 0 ? ST.seats[mySeat] : null;
  $('mySeatNo').textContent = mySeat >= 0 ? (mySeat + 1) + ' 號' : '—';
  $('myChips').textContent = me ? fmt(me.chips) : '—';

  ['bb', 'sb'].forEach(function (w) {
    var el = $(w + 'In');
    var n = me ? Engine.handsUntil(ST, mySeat, w) : -1;
    el.className = 'v small';
    if (n < 0) { el.textContent = '—'; return; }
    if (n === 0) { el.textContent = '就是這手'; el.className = 'v small now'; }
    else if (n === 1) el.textContent = '下一手';
    else el.textContent = '再 ' + n + ' 手';
  });
}

function renderCenter() {
  var total = Engine.potTotal(ST);
  setPot(total);
  setStack(total, ST.settings.bb);

  var ph = ST.hand.phase === 'idle' ? '等待開牌' : Engine.phaseName(ST.hand.phase);
  $('phase').textContent = ST.hand.no ? '第 ' + ST.hand.no + ' 手 · ' + ph : ph;
  $('sidepots').textContent = (ST.pots && ST.pots.length > 1)
    ? ST.pots.map(function (p, i) { return (i === 0 ? '主池' : '邊池' + i) + ' ' + fmt(p.amount); }).join('　')
    : '';
}

function renderSeats() {
  var felt = $('felt');
  Array.prototype.slice.call(felt.querySelectorAll('.seat')).forEach(function (n) { n.remove(); });
  var n = ST.seats.length, base = mySeat >= 0 ? mySeat : 0;
  for (var i = 0; i < n; i++) {
    var d = ((i - base) % n + n) % n;
    var th = (90 + d * 360 / n) * Math.PI / 180;
    felt.appendChild(seatNode(i, 50 + 41 * Math.cos(th), 50 + 37 * Math.sin(th)));
  }
}

function seatNode(i, x, y) {
  var p = ST.seats[i];
  var el = document.createElement('div');
  el.className = 'seat' + (p ? '' : ' empty') +
    (p && p.folded ? ' folded' : '') +
    (ST.hand.turnSeat === i ? ' turn' : '') +
    (i === mySeat ? ' me' : '');
  el.style.left = x + '%';
  el.style.top = y + '%';

  var inner = '<div class="card">';
  if (!p) {
    inner += '<div class="nm" style="color:var(--ash)">空位</div><div class="st">' + (i + 1) + ' 號</div>';
  } else {
    inner += '<div class="nm">' + esc(p.name) + '</div><div class="ch">' + fmt(p.chips) + '</div>';
    if (p.allIn) inner += '<div class="allin">ALL IN</div>';
    else if (p.chips <= 0 && p.state === 'sitout') inner += '<div class="allin">出局</div>';
    else if (p.state === 'sitout') inner += '<div class="st">暫離</div>';
    else if (p.state === 'waiting') inner += '<div class="st">下一手</div>';
    else if (p.folded) inner += '<div class="st">已蓋牌</div>';
  }
  inner += '</div>';
  if (p && p.bet > 0) inner += '<div class="bet">' + fmt(p.bet) + '</div>';
  var tag = Engine.positionLabel(ST, i);
  if (tag) inner += '<div class="tag">' + tag + '</div>';
  el.innerHTML = inner;
  return el;
}

/* ---------- 動作列 ---------- */
function renderActions() {
  var row = $('actRow'), box = $('raiseBox');

  if (mySeat < 0) {
    box.classList.remove('on');
    row.innerHTML = '<div class="waiting">正在幫你找位子…</div>';
    if (!renderActions._asked) {
      renderActions._asked = true;
      send('join', { name: myName || myId });
    }
    return;
  }
  var me = ST.seats[mySeat];

  if (me.chips <= 0 && ST.hand.phase === 'idle') {
    box.classList.remove('on');
    row.innerHTML = '<div class="waiting">你出局了，等主辦補碼</div>';
    return;
  }
  if (ST.hand.phase === 'showdown') {
    box.classList.remove('on');
    row.innerHTML = '<div class="waiting">攤牌中，等主辦判定贏家</div>';
    return;
  }
  if (ST.hand.turnSeat !== mySeat) {
    box.classList.remove('on');
    raiseOpen = false;
    var msg = ST.hand.phase === 'idle' ? '等主辦開下一手' : '等別人動作';
    if (me.state === 'waiting') msg = '下一手才輪到你';
    if (me.state === 'sitout') msg = '你目前暫離中';
    row.innerHTML = '<div class="waiting">' + msg + '</div>';
    return;
  }

  var L = Engine.legalMoves(ST, mySeat);
  var html = '<div class="act-row"><button class="btn danger" data-a="fold">蓋牌</button>';
  html += L.check ? '<button class="btn ghost" data-a="check">過牌</button>'
                  : '<button class="btn ghost" data-a="call">跟 ' + fmt(L.call) + '</button>';
  if (L.maxRaise > 0) {
    html += '<button class="btn" data-a="raiseOpen">' + (ST.hand.currentBet === 0 ? '下注' : '加注') + '</button>';
  }
  html += '</div>';
  row.innerHTML = html;

  Array.prototype.slice.call(row.querySelectorAll('[data-a]')).forEach(function (b) {
    b.addEventListener('click', function () {
      var a = b.getAttribute('data-a');
      if (a === 'raiseOpen') { raiseOpen = true; setupRaise(L); return; }
      raiseOpen = false;
      send(a);
    });
  });

  if (raiseOpen) setupRaise(L); else box.classList.remove('on');
}

function setupRaise(L) {
  var box = $('raiseBox'), val = $('raiseVal'), sl = $('raiseSlider');
  box.classList.add('on');
  sl.min = L.minRaise; sl.max = L.maxRaise; sl.step = 1;
  if (!val.value || +val.value < L.minRaise || +val.value > L.maxRaise) val.value = L.minRaise;
  sl.value = val.value;
  sl.oninput = function () { val.value = sl.value; };
  val.oninput = function () { sl.value = val.value; };

  Array.prototype.slice.call(box.querySelectorAll('[data-q]')).forEach(function (b) {
    b.onclick = function () {
      var pot = Engine.potTotal(ST), q = b.getAttribute('data-q'), v;
      if (q === 'min') v = L.minRaise;
      else if (q === 'half') v = ST.hand.currentBet + Math.round(pot / 2);
      else if (q === 'pot') v = ST.hand.currentBet + pot;
      else v = L.maxRaise;
      val.value = sl.value = Math.max(L.minRaise, Math.min(L.maxRaise, Math.round(v)));
    };
  });

  $('raiseCancel').onclick = function () { raiseOpen = false; box.classList.remove('on'); };

  var row = $('actRow');
  if (!row.querySelector('[data-a="confirmRaise"]')) {
    var b = document.createElement('button');
    b.className = 'btn';
    b.style.marginTop = '8px';
    b.setAttribute('data-a', 'confirmRaise');
    b.textContent = '確認';
    b.onclick = function () {
      var v = Math.round(+val.value);
      raiseOpen = false;
      send(v >= L.maxRaise ? 'allin' : 'raise', { amount: v });
    };
    row.appendChild(b);
  }
}

/* ---------- 抽屜 ---------- */
$('drawerBtn').addEventListener('click', function () { $('drawer').classList.add('on'); renderDrawer(); });
$('drawer').addEventListener('click', function (e) { if (e.target === $('drawer')) $('drawer').classList.remove('on'); });

function renderDrawer() {
  if (!ST) return;
  var h = '<h3>牌桌</h3><p class="hint">你是編號 ' + myId + '</p>';
  h += '<div class="sec">盲注</div><p class="hint">小盲 ' + fmt(ST.settings.sb) + '　大盲 ' + fmt(ST.settings.bb) + '</p>';
  h += '<div class="sec">紀錄</div><div class="logbox">' +
       (ST.log || []).slice().reverse().map(function (l) { return esc(l.text); }).join('<br>') + '</div>';
  h += '<div class="sec">你</div>';
  if (mySeat >= 0) {
    var me = ST.seats[mySeat];
    h += '<button class="btn ghost" id="toggleSitout">' +
         (me.state === 'sitout' ? '我要繼續玩' : '這幾輪先不玩') + '</button>';
    h += '<p class="hint" style="margin-top:9px">開著的話會直接跳過你，不用一直蓋牌。想回來隨時按。</p>';
  }
  h += '<button class="btn ghost" style="margin-top:8px" id="muteBtn">' +
       (FX.muted ? '音效與震動：關' : '音效與震動：開') + '</button>';
  h += '<button class="btn danger" style="margin-top:8px" id="logout">登出</button>';
  $('drawerInner').innerHTML = h;

  if ($('toggleSitout')) $('toggleSitout').onclick = function () {
    send('sitout', { value: ST.seats[mySeat].state !== 'sitout' });
    $('drawer').classList.remove('on');
  };
  $('muteBtn').onclick = function () {
    FX.muted = !FX.muted;
    LS.set('muted', FX.muted);
    if (!FX.muted) SFX.chip();
    renderDrawer();
  };
  $('logout').onclick = function () {
    auth.signOut().then(function () { location.reload(); });
  };
}

window.addEventListener('resize', function () { if (ST) renderSeats(); });

/* ================= 啟動 ================= */
$('loginBtn').disabled = true;
signIn().then(function () {
  $('loginBtn').disabled = false;
}).catch(function () {
  toast('連不上 Firebase，「匿名」登入可能沒開', 'bad');
});

})();
</script>
</body>
</html>
